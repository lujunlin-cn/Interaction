function recentProjectCard(sc){const chars=projectCharacters(sc),expanded=S.ui.recentProjectExpanded===sc.id;return `<div class="recent-project ${S.editId===sc.id?'active':''}"><button class="recent-project-main" data-action="ia-project" data-id="${esc(sc.id)}"><div class="recent-project-title">${esc(sc.title)}</div><div class="recent-project-summary">${esc(projectMemory(sc))}</div><div class="recent-project-characters">${chars.map(c=>tinyAvatar(c.name)).join('')}<span>${esc(chars.map(c=>c.name).join(' · ')||'尚未设置角色')}</span></div><div class="recent-project-progress">${esc(projectProgress(sc))}</div></button><button class="recent-project-more" data-action="toggle-project-memory" data-id="${esc(sc.id)}">${expanded?'收起简介':'详细简介'}</button>${expanded?`<div class="recent-project-detail">${esc(sc.description||'尚未填写详细简介')}</div>`:''}</div>`}

iaSidebar=function(){iaState();const p=S.ui.page,ct=S.ui.creatorTab,dt=S.ui.devTab,sc=editScenario(),sess=session(),projects=S.library.slice(0,4),dev=S.productSettings.mode==='developer';let html=`<div class="sidebar-brand"><span class="sidebar-mark">剧</span><span>互动短剧</span></div><button class="sidebar-create" data-action="new-scenario">＋ 创建故事</button>`;
 html+=`<div class="sidebar-section"><div class="sidebar-section-title">场景</div>${iaNavButton('故事库','ia-nav','home',p==='home','⌂')}${iaNavButton('当前游玩','ia-nav','player',p==='player','▶',!sess)}${iaNavButton('角色库','ia-nav','characterLibrary',p==='characterLibrary','人')}</div>`;
 html+=`<div class="sidebar-section"><div class="sidebar-section-title">创作</div>${iaNavButton('概览','ia-creator','overview',p==='creator'&&ct==='overview','◫')}${iaNavButton('世界','ia-creator','world',p==='creator'&&ct==='world','◎')}${iaNavButton('角色','ia-creator','characters',p==='creator'&&ct==='characters','人')}`;
 if(p==='creator'&&ct==='characters'&&sc){html+=`<div class="sidebar-subitems">${sc.characters.map(c=>iaNavButton(c.identity,'ia-character',c.id,S.ui.characterId===c.id,'·')).join('')}</div>`}
 html+=`${iaNavButton('戏剧结构','ia-creator','drama',p==='creator'&&ct==='drama','◇')}${iaNavButton('玩法机制','ia-creator','mechanics',p==='creator'&&ct==='mechanics','⚙')}${iaNavButton('素材','ia-nav','assets',p==='assets','▧')}${iaNavButton('发布','ia-creator','publish',p==='creator'&&ct==='publish','↑')}</div>`;
 if(dev)html+=`<div class="sidebar-section"><div class="sidebar-section-title">开发者</div>${[['skills','系统 Skills','⌁'],['branches','分支预测','⑂'],['world','世界状态','▦'],['drama','戏剧控制','◇'],['cache','分支缓存','▤'],['router','模型路由','⇄'],['runtime','运行环境','▣'],['production','视频生成','◈'],['assembly','视频装配','≡'],['trace','Trace','⌇'],['metrics','Metrics','∿'],['qa','QA','✓'],['prototype','Prototype Controls','⚑']].map(([k,l,i])=>iaNavButton(l,'ia-dev',k,p==='developer'&&dt===k,i)).join('')}</div>`;
 html+=`<div class="sidebar-section recent-section"><div class="sidebar-section-title">最近项目</div>${projects.map(recentProjectCard).join('')}</div>`;
 html+=`<div class="sidebar-spacer"></div><div class="sidebar-bottom">${iaNavButton('设置','ia-nav','settings',p==='settings','⚙')}<div class="mode-label">${S.productSettings.mode==='developer'?'开发者模式':'标准模式'}</div></div>`;return html;
};

var legacyIaTitleProductV4=iaTitle;
iaTitle=function(){if(S.ui.page==='characterLibrary')return '角色库';if(S.ui.page==='developer')return IA_DEV_TITLES[S.ui.devTab]||'开发者';return legacyIaTitleProductV4()};

function iaHomeV4(){const items=S.library;return `<div class="home-intro"><h1>选择一个世界，或亲手创建</h1><p class="muted">预设故事只是起点，你仍然可以在游玩中做出计划外的行动。</p><div class="toolbar">${btn('创建故事','new-scenario','','primary')}${btn('导入故事','import-scenario')}${session()?btn('继续当前游玩','nav','player'):''}</div></div><h2>故事库</h2><div class="grid">${items.map(sc=>`<article class="card story-library-card"><div class="row"><h3 class="grow">${esc(sc.title)}</h3>${badge(userScenarioStatus(sc.status))}</div><p>${esc(sc.description||'尚未填写故事简介')}</p><div class="pillrow">${badge(sc.owner==='official'?'官方故事':'我的故事')}${badge(sc.genre)}</div><p class="muted">玩法：${Object.entries(sc.mechanics).filter(([k,v])=>v.enabled).map(([k])=>esc(mechanicLabel(k))).join(' · ')||'剧情互动'}<br>参考素材：图片 ${sc.assets.filter(a=>a.type==='image').length} · 声音 ${sc.assets.filter(a=>a.type==='voice').length} · 视频 ${sc.assets.filter(a=>a.type==='video').length}</p><div class="toolbar">${btn('开始游玩','intro',sc.id,'primary',!sc.publishHistory?.length&&sc.status!=='PUBLISHED')}${btn('编辑','edit-scenario',sc.id)}${btn('复制','duplicate-scenario',sc.id,'small')}${btn('删除','delete-scenario',sc.id,'danger small')}</div></article>`).join('')}</div>`}

function globalCharacterCard(g){return `<article class="global-character-card"><button class="global-character-open" data-action="open-global-character" data-id="${esc(g.id)}">${globalAvatar(g)}<div class="global-character-copy"><div class="row"><h3 class="grow">${esc(g.name)}</h3><span class="version-pill">v${g.version}</span></div><p>${esc(g.description)}</p><div class="pillrow">${(g.tags||[]).slice(0,4).map(t=>`<span class="soft-tag">${esc(t)}</span>`).join('')}</div><div class="character-stats"><span>形象参考 ${visualRefCount(g)}</span><span>声音参考 ${g.voice?.primary?'已设置':'未设置'}</span><span>${characterUsageCount(g.id)} 个故事使用</span></div></div></button></article>`}
function renderRefList(title,items,actionId,kind){return `<div class="identity-panel"><div class="row"><h4 class="grow">${title}</h4>${btn('添加参考','global-char-add-ref',actionId+':'+kind,'small')}</div>${items?.length?items.map(x=>`<div class="ref-chip">${esc(x)}</div>`).join(''):'<div class="muted">尚未添加</div>'}</div>`}
function iaGlobalCharacterDetail(g){const uses=characterUsageStories(g.id);return `<div class="task-head"><div class="grow"><button class="text-button" data-action="back-character-library">← 返回角色库</button><h1>${esc(g.name)}</h1><p class="muted">全局角色 · v${g.version} · 被 ${uses.length} 个故事使用</p></div>${globalAvatar(g,'large')}</div><section class="focus-section"><h3>角色基础信息</h3><div class="two">${input('global-char-name','名字',g.name)}${input('global-char-profession','职业',g.profession||'')}${area('global-char-description','简介',g.description||'')}${area('global-char-personality','基础人格',g.personality||'')}</div>${input('global-char-tags','标签（用逗号分隔）',(g.tags||[]).join('，'))}<div class="row">${btn('保存为新版本','save-global-character',g.id,'primary')}<span class="muted">保存会创建新版本；已有故事仍继续使用各自的角色快照。</span></div></section><section class="focus-section"><h3>视觉身份</h3><div class="identity-grid">${renderRefList('正面图',g.visual?.front,g.id,'front')}${renderRefList('侧面图',g.visual?.side,g.id,'side')}${renderRefList('背面图',g.visual?.back,g.id,'back')}${renderRefList('其他参考图片',g.visual?.other,g.id,'other')}</div></section><section class="focus-section"><h3>声音身份</h3><div class="identity-grid"><div class="identity-panel"><h4>主声音参考</h4><div class="ref-chip">${esc(g.voice?.primary||'尚未设置')}</div>${btn('替换主声音','global-char-add-ref',g.id+':voice-primary','small')}</div>${renderRefList('其他声音参考',g.voice?.other,g.id,'voice-other')}</div></section><section class="focus-section"><h3>动作参考</h3>${renderRefList('视频参考',g.motion,g.id,'motion')}</section><section class="focus-section"><h3>正在使用这个角色的故事</h3>${uses.length?uses.map(sc=>`<div class="notice"><b>${esc(sc.title)}</b><br><span class="muted">故事保留自己的角色快照；角色库更新不会自动覆盖。</span> ${btn('打开故事','ia-project',sc.id,'small')}</div>`).join(''):empty('还没有故事使用这个角色。')}</section>`}
function iaCharacterLibrary(){ensureProductState();const selected=globalCharacter(S.ui.globalCharacterId);if(selected)return iaGlobalCharacterDetail(selected);const q=(S.ui.characterSearch||'').trim().toLowerCase();const list=S.characterLibrary.filter(g=>!q||[g.name,g.description,g.profession,g.personality,...(g.tags||[])].join(' ').toLowerCase().includes(q));return `<div class="task-head"><div class="grow"><h1>角色库</h1><p class="muted">跨故事共享稳定的角色身份资产。故事使用的是角色快照，不会被角色库的后续修改自动覆盖。</p></div>${btn('新建全局角色','create-global-character','','primary')}</div><div class="character-searchbar"><input id="global-character-search" placeholder="按名字、描述、标签、职业或性格搜索" value="${esc(S.ui.characterSearch||'')}"></div><div class="global-character-grid">${list.map(globalCharacterCard).join('')||empty('没有找到匹配的角色。')}</div>`}

function scenarioCharacterGlobalStatus(c){const g=globalCharacter(c.globalCharacterId);if(!g)return {g:null,hasUpdate:false};const ignored=Number(c.ignoredGlobalVersion||0);return {g,hasUpdate:g.version>Number(c.globalCharacterVersion||0)&&g.version>ignored}}
function scenarioCharacterSnapshotPanel(c){const {g,hasUpdate}=scenarioCharacterGlobalStatus(c);if(!g)return `<div class="character-origin-panel"><div class="row"><b class="grow">故事角色</b>${badge('未绑定角色库')}</div><p class="muted">这个角色只存在于当前故事。你可以保留它，也可以从全局角色库选择一个角色创建新的故事实例。</p></div>`;const snap=c.globalCharacterSnapshot||characterSnapshotAt(g,c.globalCharacterVersion);return `<div class="character-origin-panel"><div class="row"><div>${globalAvatar({name:snap.name},'small')}</div><div class="grow"><b>${esc(snap.name)}</b><div class="muted">角色库快照 v${c.globalCharacterVersion} · ${esc(snap.profession||'未填写职业')}</div></div>${hasUpdate?badge('角色库存在新版本','warn'):badge('角色快照已固定')}</div><div class="snapshot-grid"><div><span>基础人格</span>${esc(snap.personality||'未填写')}</div><div><span>稳定身份资产</span>形象 ${Object.values(snap.visual||{}).flat().length} · 声音 ${snap.voice?.primary?'已设置':'未设置'} · 动作 ${(snap.motion||[]).length}</div></div>${hasUpdate?`<div class="row" style="margin-top:12px">${btn('查看变化','view-global-character-diff',c.id,'small')}${btn('更新到新版本','sync-scenario-character',c.id,'primary small')}${btn('继续使用当前版本','keep-scenario-character-version',c.id,'small')}</div>`:''}</div>`}
function characterPicker(sc){if(!S.ui.characterPickerOpen)return '';const used=new Set(sc.characters.map(c=>c.globalCharacterId).filter(Boolean));return `<div class="character-picker"><div class="row"><div class="grow"><h3>从角色库选择</h3><p class="muted">加入故事时会复制一份当前角色快照；后续角色库更新不会自动改变这个故事。</p></div>${btn('关闭','toggle-character-picker','','small')}</div><div class="character-picker-grid">${S.characterLibrary.map(g=>`<div class="character-picker-item">${globalAvatar(g,'small')}<div class="grow"><b>${esc(g.name)}</b><small>${esc(g.profession||'')}</small></div>${btn(used.has(g.id)?'已加入':'加入故事','add-global-character-to-scenario',g.id,used.has(g.id)?'small':'primary small',used.has(g.id))}</div>`).join('')}</div></div>`}
function iaScenarioCharacters(){const sc=editScenario();let idx=sc.characters.findIndex(c=>c.id===S.ui.characterId);if(idx<0)idx=0;const c=sc.characters[idx];S.ui.characterId=c?.id;const head=`<div class="task-head"><div class="grow"><h1>角色</h1><div class="muted">${esc(sc.title)} · 故事角色实例与全局角色身份分开保存</div></div><div class="task-head-actions"><select id="edit-scenario-select" aria-label="选择编辑的故事">${options(S.library.map(s=>[s.id,s.title]),sc.id)}</select>${btn('预览','preview-scenario','','small')}${btn('开始游玩','intro',sc.id,'primary',!sc.publishHistory.length)}</div></div>`;return `${head}<div class="character-switcher">${sc.characters.map(x=>btn(x.identity,'ia-character',x.id,x.id===c?.id?'active small':'small')).join('')}${btn('从角色库选择','toggle-character-picker','','small')}${btn('创建新角色','add-character','','small')}</div>${characterPicker(sc)}${c?`<section class="focus-section">${scenarioCharacterSnapshotPanel(c)}<div class="story-instance-panel"><div class="row"><h3 class="grow">本故事中的角色</h3>${btn('删除角色','delete-character',String(idx),'small danger',c.id===sc.playerCharacter)}</div><p class="muted">下面只描述这个故事里的身份、目标、秘密、知情范围和当前状态。修改这些字段不会反向改变全局角色库。</p><div class="two">${fieldControl('characters.'+idx+'.identity','本故事身份',false)}${fieldControl('characters.'+idx+'.desire','目标')}${fieldControl('characters.'+idx+'.fear','恐惧')}${fieldControl('characters.'+idx+'.secrets','秘密')}${fieldControl('characters.'+idx+'.knowledge','知情范围')}${fieldControl('characters.'+idx+'.relationship','与其他角色的关系')}</div>${fieldControl('characters.'+idx+'.personality','本故事中的性格表现')}${fieldControl('characters.'+idx+'.visualState','当前视觉状态')}</div></section>`:empty('还没有角色。')}`}
function iaMechanicsV4(){const sc=editScenario();const head=`<div class="task-head"><div class="grow"><h1>玩法机制</h1><div class="muted">${esc(sc.title)} · 只选择玩家能理解的故事互动方式</div></div><div class="task-head-actions"><select id="edit-scenario-select">${options(S.library.map(s=>[s.id,s.title]),sc.id)}</select></div></div>`;return `${head}<section class="focus-section"><p class="muted">这些是故事玩法设置，不需要理解内部技术实现。发布后，已经开始的游玩会继续使用原来的机制快照。</p>${Object.entries(sc.mechanics).map(([k,v])=>`<div class="mechanic-row"><div class="grow"><h3>${esc(mechanicLabel(k))}</h3><p>${esc(mechanicDescription(k))}</p></div><div class="row">${badge(v.enabled?'已启用':'已停用')}${btn(v.enabled?'停用':'启用','toggle-mechanic',k,'small')}${btn('设置','mechanic-config',k,'small')}</div></div>`).join('')}</section>`}

iaCreator=function(){if(S.authorTask)return legacyIaCreatorProductV4();if(S.ui.creatorTab==='characters')return iaScenarioCharacters();if(S.ui.creatorTab==='mechanics')return iaMechanicsV4();let html=legacyIaCreatorProductV4();if(S.ui.creatorTab==='publish')html=html.replace(/主题与显示设置/g,'故事视觉设定').replace(/data-action="ia-nav" data-id="settings"/g,'data-action="ia-creator" data-id="theme"');return html};
renderCreator=iaCreator;

function iaSystemSkills(){return `<div class="card"><h3>平台系统 Skills</h3><p class="muted">这些能力属于开发者配置，不出现在普通创作者工作流中。</p>${PLATFORM_SKILLS.map(k=>{const cfg=S.skills[k];return `<div class="system-skill-row"><div class="grow"><b>${esc(k)}</b><p>${esc(SKILL_DESCRIPTIONS[k]||'')}</p></div><div class="row">${badge(cfg.enabled?'ENABLED':'DISABLED')}${btn('说明','skill-detail',k,'small')}${btn('配置','skill-config',k,'small')}${btn(cfg.enabled?'停用':'启用','toggle-skill',k,'small')}${btn('调用记录','skill-logs',k,'small')}</div></div>`}).join('')}</div>`}
iaDeveloper=function(){const tab=S.ui.devTab||'branches';const map={skills:iaSystemSkills,branches:renderBranches,world:renderWorld,drama:renderDrama,cache:renderCache,router:renderRouter,runtime:renderRuntime,production:renderProduction,assembly:renderAssembly,trace:renderTrace,metrics:renderMetrics,qa:renderQA,prototype:iaPrototypeControls};let body;if(['skills','router','runtime','qa','trace','metrics','prototype'].includes(tab)||session())body=(map[tab]||renderBranches)();else body=empty('先开始一个游玩会话，才能观察该运行中模块。系统 Skills、模型路由、运行环境、Trace、Metrics、QA 和 Prototype Controls 可以独立打开。');if(tab==='qa'){const sc=editScenario();body+=detail('当前故事包技术详情',json({schema_version:'1.0-prototype',id:sc.id,version:sc.version,player_character_id:sc.playerCharacter,world_rules:sc.world.rules,drama_spec:sc.drama,assets_manifest:sc.assets.map(a=>({id:a.id,type:a.type,version:a.version,bound_entity:a.entity,canonical:a.canonical})),skills_lock:sc.mechanics,ui_theme:sc.theme,code_execution:false}),false)}return `<div class="dev-module-title"><h1>${esc(IA_DEV_TITLES[tab]||'开发者')}</h1><p>技术状态、内部 ID、Provider、Trace 与系统 Skills 只在开发者模式中显示。</p></div><div class="dev-module">${body}</div>`};
renderDeveloper=iaDeveloper;

function settingChoice(label,action,value,current){return `<button class="setting-choice ${value===current?'active':''}" data-action="${action}" data-id="${esc(value)}">${esc(label)}</button>`}
function subtitlePreview(){const pos=S.productSettings.subtitles.position;return `<div class="subtitle-preview ${pos==='outside'?'outside':''}"><div class="preview-frame"><div class="preview-scene">雨夜公寓 · 门厅</div>${pos==='inside'?'<div class="preview-caption">Alice：我今晚就要走。</div>':''}</div>${pos==='outside'?'<div class="preview-caption outside-caption">Alice：我今晚就要走。</div>':''}</div>`}

/* Settings */
.setting-choice-row{display:flex;gap:.55rem;flex-wrap:wrap;margin:.6rem 0 1rem}.setting-choice{border-radius:999px;padding:.55rem .9rem}.setting-choice.active{background:var(--app-text);color:var(--app-bg);border-color:var(--app-text)}
.mode-explain{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;background:var(--app-soft);color:var(--app-muted)}
.subtitle-preview{margin-top:.8rem;max-width:520px}.preview-frame{height:180px;border-radius:14px;background:#171717;position:relative;display:flex;align-items:center;justify-content:center;color:#fff}.preview-scene{font-size:var(--app-small);opacity:.7}.preview-caption{position:absolute;bottom:.75rem;left:7%;right:7%;font-size:var(--subtitle-size);line-height:1.35;text-align:center;background:rgba(0,0,0,.62);padding:.35em .7em;border-radius:7px;color:#fff}.subtitle-preview.outside .preview-frame{margin-bottom:calc(var(--subtitle-size) * 2.3 + .8rem)}.outside-caption{position:static;background:transparent;color:var(--app-text);margin-top:.6rem}

/* Recent project memory */
.recent-section{margin-top:.7rem}.recent-project{margin:.32rem 0;border-radius:10px}.recent-project.active{background:var(--app-hover)}.recent-project-main{display:block;width:100%;border:0;background:transparent;text-align:left;padding:.62rem .65rem;color:var(--app-text);border-radius:10px}.recent-project-main:hover{background:var(--app-hover);border-color:transparent}.recent-project-title{font-weight:700;margin-bottom:.28rem}.recent-project-summary{font-size:var(--app-small);color:var(--app-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}.recent-project-characters{display:flex;align-items:center;gap:.22rem;margin-top:.48rem;font-size:var(--app-small);color:var(--app-muted)}.tiny-avatar{width:1.35rem;height:1.35rem;border-radius:50%;display:inline-grid;place-items:center;background:#dfe4e8;color:#44515a;font-size:.72em;font-weight:700;border:1px solid rgba(0,0,0,.08)}.recent-project-progress{font-size:var(--app-small);color:var(--app-text);margin-top:.4rem}.recent-project-more{border:0;background:transparent;color:var(--app-muted);font-size:var(--app-small);padding:.15rem .65rem .45rem}.recent-project-more:hover{background:transparent;border-color:transparent;text-decoration:underline}.recent-project-detail{font-size:var(--app-small);color:var(--app-muted);padding:0 .65rem .72rem;line-height:1.45}

/* Global character library */
.character-searchbar{margin:0 0 1.2rem}.character-searchbar input{width:100%;border-radius:12px;padding:.8rem 1rem}.global-character-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}.global-character-card{border:1px solid var(--app-line);border-radius:14px;background:var(--app-surface);overflow:hidden}.global-character-open{width:100%;border:0;background:transparent;text-align:left;padding:1.05rem;display:flex;gap:1rem;align-items:flex-start;color:var(--app-text)}.global-character-open:hover{background:var(--app-soft);border-color:transparent}.global-character-copy{min-width:0;flex:1}.global-character-copy h3{margin:0}.global-character-copy p{margin:.45rem 0;color:var(--app-muted);line-height:1.45}.global-avatar{width:4.2rem;height:4.2rem;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#d9e0e5,#b9c7d2);color:#31434f;font-weight:750;font-size:1.45rem;flex:none;border:1px solid rgba(0,0,0,.08)}.global-avatar.small{width:2.7rem;height:2.7rem;border-radius:11px;font-size:1rem}.global-avatar.large{width:5.2rem;height:5.2rem;border-radius:20px;font-size:1.75rem}.soft-tag,.version-pill{font-size:var(--app-small);padding:.18rem .48rem;border-radius:999px;background:var(--app-soft);border:1px solid var(--app-line);color:var(--app-muted)}.character-stats{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.75rem;color:var(--app-muted);font-size:var(--app-small)}.text-button{border:0;background:transparent;padding:.2rem 0;color:var(--app-muted)}.text-button:hover{background:transparent;border-color:transparent;text-decoration:underline}.identity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.identity-panel{border:1px solid var(--app-line);border-radius:12px;padding:1rem;background:var(--app-surface)}.ref-chip{padding:.5rem .65rem;border-radius:8px;background:var(--app-soft);border:1px solid var(--app-line);margin:.35rem 0;font-size:var(--app-small)}

/* Scenario character snapshot vs story instance */
.character-origin-panel{border:1px solid var(--app-line);border-radius:14px;padding:1rem 1.1rem;background:var(--app-soft);margin-bottom:1.1rem}.snapshot-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem}.snapshot-grid>div{font-size:var(--app-small);color:var(--app-muted)}.snapshot-grid span{display:block;font-weight:700;color:var(--app-text);margin-bottom:.2rem}.story-instance-panel{padding-top:.6rem}.character-picker{border:1px solid var(--app-line);border-radius:14px;padding:1rem;margin-bottom:1.1rem;background:var(--app-soft)}.character-picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.65rem;margin-top:.8rem}.character-picker-item{display:flex;align-items:center;gap:.7rem;padding:.65rem;border-radius:10px;background:var(--app-surface);border:1px solid var(--app-line)}.character-picker-item small{display:block}.version-compare{border:1px solid var(--app-line);border-radius:12px;padding:1rem;background:var(--app-surface)}.version-compare.new{outline:2px solid rgba(36,84,119,.18)}
.mechanic-row,.system-skill-row{display:flex;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--app-line)}.mechanic-row:last-child,.system-skill-row:last-child{border-bottom:0}.mechanic-row h3,.system-skill-row p{margin-bottom:.2rem}
.story-library-card .pillrow{margin:.45rem 0}

/* Dark mode */
body[data-app-theme="dark"]{--app-bg:#202123;--app-surface:#28292c;--app-sidebar:#18191b;--app-text:#f1f1f2;--app-muted:#b3b4b8;--app-line:#3a3b3f;--app-soft:#2f3034;--app-hover:#303136;--app-field:#25262a;--app-shadow:0 12px 34px rgba(0,0,0,.35);color-scheme:dark}
body[data-app-theme="dark"] .sidebar-mark{background:#f1f1f2;color:#202123}
body[data-app-theme="dark"] button.primary{background:#3d6f91;border-color:#3d6f91;color:#fff}
body[data-app-theme="dark"] .badge{background:#34363a;border-color:#4a4c51;color:#e6e6e8}
body[data-app-theme="dark"] .badge.ok{background:#243d2d;color:#bde1c7;border-color:#3d6149}body[data-app-theme="dark"] .badge.warn{background:#493d20;color:#f0d68b;border-color:#69582c}body[data-app-theme="dark"] .badge.bad{background:#4b2929;color:#efb6b6;border-color:#714040}
body[data-app-theme="dark"] .tiny-avatar{background:#3a4248;color:#dce5ea;border-color:#515b62}
body[data-app-theme="dark"] .global-avatar{background:linear-gradient(145deg,#47535d,#2f3940);color:#eaf0f3;border-color:#59656e}
body[data-app-theme="dark"] .player-recommendations button,body[data-app-theme="dark"] .selected-choice{background:var(--app-surface);border-color:var(--app-line);color:var(--app-text)}
body[data-app-theme="dark"] .story-feedback{background:var(--app-soft);border-color:#56585d}
body[data-app-theme="dark"] .composer-popover{background:var(--app-surface);border-color:var(--app-line);box-shadow:var(--app-shadow)}
body[data-app-theme="dark"] dialog{background:var(--app-surface);color:var(--app-text);border-color:var(--app-line)}
body[data-app-theme="dark"] .dialoghead,body[data-app-theme="dark"] .dialogfoot{border-color:var(--app-line)}

@media(min-width:2400px){body[data-ui-size="standard"]{--app-font:16px;--app-small:14px;--sidebar-width:285px}body[data-ui-size="large"]{--app-font:18px;--app-small:16px;--sidebar-width:310px}body[data-ui-size="xlarge"]{--app-font:20px;--app-small:18px;--sidebar-width:340px}.workspace-inner{width:min(1080px,calc(100% - 64px))}.workspace-inner.wide{width:min(1380px,calc(100% - 64px))}.player-content{width:min(1040px,calc(100% - 64px))}}
@media(max-width:1050px){#shell.appframe{grid-template-columns:min(var(--sidebar-width),230px) minmax(0,1fr) 0}#shell.appframe.inspector-open{grid-template-columns:min(var(--sidebar-width),230px) minmax(0,1fr) 340px}}
@media(max-width:780px){#shell.appframe,#shell.appframe.inspector-open{grid-template-columns:min(var(--sidebar-width),205px) minmax(0,1fr)}.global-character-grid,.identity-grid,.snapshot-grid{grid-template-columns:1fr}.recent-project-summary{-webkit-line-clamp:1}}
</style>

<style>
button.small,.badge,.req,.asset-step,.asset-type-label,.progresssteps span,.devtabs button,table,.mono,pre{font-size:var(--app-small)!important}
.story-theme-preview{min-height:170px;border-radius:14px;background:linear-gradient(180deg,#22272b,#151719);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;margin-top:1rem;border-bottom:4px solid var(--preview-accent,#245477)}.preview-story-title{font-size:var(--app-h2);font-weight:700}.preview-story-caption{font-size:var(--subtitle-size);margin-top:1.1rem;padding:.35em .8em;background:rgba(0,0,0,.55);border-radius:8px}
</style>

</body>
</html>
