const AUTHOR_PHASES=['Analyzing idea','Building characters','Designing world','Creating dramatic question','Creating conflict','Creating truth model','Creating pressure sources','Creating ending families','Done'];

function generateScenario(idea){if(!idea.trim()){toast('请输入一个故事想法。');return}if(S.authorTask)return;if(!skillEnabled('scenario-authoring')){toast('scenario-authoring 已禁用，请先启用。');return}const r=routeFor('authoring',true);if(!r.selected){toast('故事创作服务暂不可用，当前草案没有被修改。');log('scenario-authoring','FAILED',{idea},{reason:'no authoring provider'},'none');return}S.authorTask={scenarioId:S.editId,idea,step:0,due:S.now+350,started:S.now,provider:r.selected,original:clone(editScenario())};log('scenario-authoring','GENERATING',{idea,locked_fields:editScenario().locks},{stages:AUTHOR_PHASES},r.selected);render()}

function scenarioErrors(sc){const errors=[];if(!sc.title?.trim())errors.push('Overview.title 不能为空');if(!sc.description?.trim())errors.push('Overview.description 不能为空');if(!Array.isArray(sc.characters)||sc.characters.length<2)errors.push('至少需要玩家和一个 NPC');const ids=(sc.characters||[]).map(c=>c.id);if(new Set(ids).size!==ids.length)errors.push('角色 ID 重复');if(!ids.includes(sc.playerCharacter))errors.push('player_character_id 没有对应角色');for(const c of sc.characters||[])if(!c.identity?.trim()||!c.id)errors.push('角色 identity / id 不完整');if(!sc.world?.rules?.trim())errors.push('World.rules 不能为空');for(const field of ['coreQuestion','centralConflict','truthModel','pressures','endingFamilies'])if(!sc.drama?.[field]?.trim())errors.push('Drama.'+field+' 不能为空');if(!sc.reviewed)errors.push('请勾选“已审阅并确认世界、真相与戏剧结构”');for(const a of sc.assets||[]){if(!['image','voice','video'].includes(a.type))errors.push('未知资产类型：'+a.id);if(a.canonical&&!a.authorized)errors.push('Canonical 素材尚未确认授权：'+a.name);if(['Character','Voice'].includes(a.binding)&&!ids.includes(a.entity))errors.push('素材绑定了不存在的角色：'+a.name);if(a.type!=='image'&&Number(a.trimEnd)<=Number(a.trimStart))errors.push('无效裁选区间：'+a.name);if(a.needsReselect)errors.push('素材需重新选择本地文件：'+a.name);if(!a.fixture&&a.metadata_status==='PREVIEW_FAILED')errors.push('素材不能由浏览器解码预览，请替换：'+a.name);if(!a.fixture&&a.metadata_status==='BROWSER_PROBING')errors.push('素材元数据仍在读取，请稍后发布：'+a.name)}if(sc.world?.rules?.includes('允许任意复活')&&sc.drama?.forbiddenOutcomes?.includes('不得'))errors.push('Mock 一致性检查：世界允许任意复活，但禁止结果存在冲突，请人工审阅');return errors}
function publishScenario(play=false){const sc=editScenario(),errors=scenarioErrors(sc);sc.validation={at:Date.now(),errors};if(errors.length){S.ui.creatorTab='publish';toast('发布校验未通过；请修正标出的字段。');render();return}const last=sc.publishHistory?.at(-1)?.version||'0.0.0';const nums=last.split('.').map(Number);sc.version=last==='0.0.0'?'1.0.0':`${nums[0]||1}.${(nums[1]||0)+1}.0`;sc.status='PUBLISHED';const snapshot=clone({...sc,publishHistory:[],validation:null});sc.publishHistory.push({version:sc.version,at:Date.now(),snapshot});log('Scenario','PUBLISHED',{scenario_id:sc.id},{version:sc.version,immutable_snapshot:true,existing_sessions_unchanged:true},'runtime');persist();toast('已发布 '+sc.version+'。已有游玩会话继续绑定原版本。');if(play)startSession(sc.id);else render()}

function renderCreator(){const sc=editScenario();const task=S.authorTask;const tab=S.ui.creatorTab;let body='';if(tab==='overview')body=`<div class="card"><h3>AI Scenario Creation ${req('FR-002 / 059')}</h3>${area('author-idea','用一句话描述你的故事',S.ui.authorIdea||'创建一个发生在雨夜公寓里的悬疑故事，玩家可以调查、关心 Alice，也可以选择离开。')}<div class="row">${btn('Generate Scenario','generate-scenario','','primary',!!task)}${task?btn('取消创作','cancel-author','','danger small'):''}<span class="muted">生成可编辑草案，不预生成整个分支树。</span></div>${task?`<div class="progresssteps" style="margin-top:12px">${AUTHOR_PHASES.map((p,i)=>`<span class="${i<task.step?'done':i===task.step?'current':''}">${i<task.step?'✓ ':''}${p}</span>`).join('')}</div>`:''}</div><div class="card"><h3>Overview</h3>${fieldControl('title','Title / 标题',false)}${fieldControl('description','Description / 简介')}<div class="two">${fieldControl('genre','Genre / 类型',false)}${fieldControl('tone','Tone / 语气',false)}</div>${fieldControl('playStyle','Expected Play Style / 预期玩法',false)}${select('player-character','玩家扮演角色',sc.characters.map(c=>[c.id,c.identity]),sc.playerCharacter)}</div>`;
 if(tab==='world')body=`<div class="card"><h3>World</h3>${fieldControl('world.rules','Rules / 世界规则')}${fieldControl('world.lore','Lore / 背景')}${fieldControl('world.locations','Locations / 地点（ID｜名称，每行一条）')}${fieldControl('world.constraints','World Constraints / 硬约束')}</div>`;
 if(tab==='characters')body=`<div class="row" style="margin-bottom:12px"><h3 class="grow">Characters</h3>${btn('添加角色','add-character')}</div>${sc.characters.map((c,i)=>`<div class="card"><div class="row"><h3 class="grow">${esc(c.identity)}</h3>${badge(c.id)}${btn('删除角色','delete-character',String(i),'small danger',c.id===sc.playerCharacter)}</div><div class="two">${fieldControl('characters.'+i+'.identity','Identity / 身份',false)}${fieldControl('characters.'+i+'.personality','Personality / 性格',false)}${fieldControl('characters.'+i+'.desire','Desire / 欲望')}${fieldControl('characters.'+i+'.fear','Fear / 恐惧')}${fieldControl('characters.'+i+'.secrets','Secrets / 秘密')}${fieldControl('characters.'+i+'.knowledge','Knowledge / 角色知情范围')}</div>${fieldControl('characters.'+i+'.relationship','Relationship / 初始关系')}${fieldControl('characters.'+i+'.visualState','Visual State / 视觉状态')}</div>`).join('')}`;
 if(tab==='drama')body=`<div class="card"><h3>Drama Structure ${req('FR-042–059')}</h3><p class="muted">你可以直接回答这些问题。字段定义世界与矛盾，不预写玩家必须走的剧情。</p>${[['coreQuestion','Core Dramatic Question · 故事最终要回答什么？'],['centralConflict','Central Conflict · 哪些目标无法同时满足？'],['truthModel','Truth Model · 哪些事实不能被反转推翻？'],['secrets','Secrets · 谁隐瞒了什么？'],['misbeliefs','Misbeliefs · 角色可能有什么误解？'],['pressures','Pressure Sources · 为什么不能一直拖？'],['anchors','Story Anchors · 哪些事件是机会而非强制轨道？'],['endingFamilies','Ending Families · 可能怎样收束？'],['foreshadows','Initial Foreshadows · 起初有哪些可追溯线索？'],['forbiddenOutcomes','Forbidden Outcomes · 哪些结果不允许发生？']].map(([k,l])=>fieldControl('drama.'+k,l)).join('')}</div>`;
 if(tab==='mechanics')body=`<div class="card"><h3>Scenario Mechanic Skills</h3><p class="muted">配置在发布后绑定会话；改变草案不会改写已经开始的游戏。</p>${Object.entries(sc.mechanics).map(([k,v])=>`<div class="card"><div class="row"><h3 class="grow">${k}</h3>${badge(v.enabled?'ENABLED':'DISABLED')}${btn(v.enabled?'禁用':'启用','toggle-mechanic',k,'small')}</div><p>${SKILL_DESCRIPTIONS[k]||'自定义机制'}</p>${json(v.config)}${btn('编辑配置','mechanic-config',k,'small')}</div>`).join('')}</div>`;
 if(tab==='theme')body=`<div class="card"><h3>受控主题配置 ${req('FR-032')}</h3>${note('只接受预定义 token，不执行自定义 CSS 或 JavaScript。当前页面可预览变化；游玩会话使用已发布的主题快照。')}<div class="two">${input('theme-accent','按钮颜色',sc.theme.accent,'color')}${select('theme-font','字体栈',[['system','系统无衬线'],['serif','系统衬线'],['mono','系统等宽']],sc.theme.font)}${select('theme-density','布局密度',[['comfortable','标准'],['compact','紧凑']],sc.theme.density)}${select('theme-subtitles','字幕样式',[['normal','标准'],['large','大字幕']],sc.theme.subtitles)}</div><div class="video" style="min-height:140px"><h3>主题预览</h3><div class="caption">Alice：你准备怎么做？</div></div></div>`;
 if(tab==='publish'){const errs=scenarioErrors(sc);body=`<div class="card"><h3>发布检查 / Scenario Package ${req('FR-004')}</h3><label class="checkrow"><input id="reviewed" type="checkbox" ${sc.reviewed?'checked':''}>我已审阅并确认世界规则、稳定真相、角色知情范围和戏剧结构。</label>${errs.length?note('<b>待修正 '+errs.length+' 项</b><div>'+errs.map(e=>esc(e)).join('<br>')+'</div>','warn'):note('结构校验通过。浏览器 Mock 检查不代替真实服务的完整语义和媒体验证。')}<div class="row">${btn('运行校验','validate-scenario')}${btn('Publish / 发布新版本','publish','','primary')}${btn('发布并试玩','publish-play','','primary')}${btn('导出 Scenario Package','export-scenario')}</div>${detail('Manifest / Typed Data / Narrative Files / Assets / Skills',json({schema_version:'1.0-prototype',id:sc.id,version:sc.version,player_character_id:sc.playerCharacter,world_rules:sc.world.rules,drama_spec:sc.drama,assets_manifest:sc.assets.map(a=>({id:a.id,type:a.type,version:a.version,bound_entity:a.entity,canonical:a.canonical})),skills_lock:sc.mechanics,ui_theme:sc.theme,code_execution:false}),false)}</div><div class="card"><h3>不可变发布版本</h3>${sc.publishHistory.length?table(['版本','发布时间','说明'],sc.publishHistory.map(v=>`<tr><td>${esc(v.version)}</td><td>${date(v.at)}</td><td>已开始的会话保留该快照 ${btn('查看快照','snapshot',v.version,'small')}</td></tr>`)):empty('尚未发布')}</div>`}
 if(tab==='changes')body=`<div class="card"><h3>字段变更记录</h3>${S.changes.filter(x=>x.scenario===sc.id).slice(0,40).map(c=>detail(esc(c.path)+' '+badge(c.source),`<div class="two"><div><b>Before</b>${json(c.before)}</div><div><b>After</b>${json(c.after)}</div></div><span class="muted">${date(c.at)} · 仅该字段被修改</span>`)).join('')||empty('尚无修改记录')}</div>`;
 return `<div class="row"><div class="grow"><h1>Creator Workspace</h1><div class="muted">${esc(sc.title)} · ${badge(sc.status)} · 最近版本 ${esc(sc.version)}</div></div><select id="edit-scenario-select" aria-label="选择编辑的 Scenario">${options(S.library.map(s=>[s.id,s.title]),sc.id)}</select>${btn('Preview','preview-scenario')}${btn('Play','intro',sc.id,'primary',!sc.publishHistory.length)}</div>${sc.publishHistory.length&&sc.status==='DRAFT'?note('你正在编辑新草案。已有游玩会话仍绑定此前发布版本，不会突然替换角色或素材。'):''}<div class="tabs">${[['overview','Overview'],['world','World'],['characters','Characters'],['drama','Drama Structure'],['mechanics','Mechanics'],['theme','Theme'],['publish','Validate & Publish'],['changes','Changes']].map(([k,t])=>btn(t,'creator-tab',k,tab===k?'active':'')).join('')}</div>${task&&tab!=='overview'?note('正在起草：'+AUTHOR_PHASES[task.step]):''}${body}`;}
function assetPreview(a){if(a.needsReselect)return '本地文件需重新选择';if(!a.dataUrl){const label=a.type==='image'?'图片参考':a.type==='voice'?'声音参考':'视频参考';return `<div style="text-align:center"><b>${label}</b><br><small>内置示例素材</small></div>`}if(a.type==='image')return `<img alt="${esc(a.name)}" src="${esc(a.dataUrl)}">`;if(a.type==='voice')return `<audio id="media-${a.id}" controls preload="metadata" src="${esc(a.dataUrl)}"></audio>`;return `<video id="media-${a.id}" controls preload="metadata" src="${esc(a.dataUrl)}"></video>`}
function renderAssets(){const sc=editScenario(),filter=S.ui.assetFilter;const bindingOptions=[['Character','角色'],['Location','地点'],['Style','整体风格'],['Voice','角色声音'],['Motion reference','动作参考']];const roleOptions=[['identity','人物身份'],['wardrobe','服装'],['location','地点'],['style','画面风格'],['voice','声音'],['motion','动作'],['camera','镜头']];return `<div class="row"><div class="grow"><h1>素材</h1><p class="muted">${esc(sc.title)} · 为角色、地点、声音和动作准备参考素材</p></div><select id="edit-scenario-select">${options(S.library.map(s=>[s.id,s.title]),sc.id)}</select></div><div class="card"><h3>添加参考素材</h3><div class="toolbar">${btn('上传图片','upload-asset','image','primary')}${btn('上传声音','upload-asset','voice','primary')}${btn('上传视频','upload-asset','video','primary')}</div><p class="muted" style="margin-top:8px">选择本地文件后，会先在浏览器中读取并预览，再由你确认绑定对象和用途。</p><div class="row">${[['all','全部'],['image','图片'],['voice','声音'],['video','视频']].map(([k,l])=>btn(l,'asset-filter',k,filter===k?'active small':'small')).join('')}${btn('查看主要参考','asset-mapping','','small')}${btn('前往发布','go-publish','','small')}</div></div><div class="assetgrid">${sc.assets.filter(a=>filter==='all'||a.type===filter).map(a=>{const probing=a.metadata_status==='BROWSER_PROBING';const previewOk=['BROWSER_VALIDATED','BROWSER_METADATA_ONLY','MOCK_FIXTURE'].includes(a.metadata_status);const step=probing?1:!previewOk?1:!a.authorized?2:!a.canonical?3:4;return `<article class="card"><div class="row"><h3 class="grow">${esc(a.name)}</h3><span class="asset-type-label">${assetTypeCN(a.type)}</span></div><div class="asset-steps"><span class="asset-step done">✓ 已选择文件</span><span class="asset-step ${previewOk?'done':step===1?'current':''}">${previewOk?'✓ ':''}${probing?'正在读取':'预览'}</span><span class="asset-step ${a.authorized?'done':step===2?'current':''}">${a.authorized?'✓ ':''}绑定与授权</span><span class="asset-step ${a.canonical?'done':step===3?'current':''}">${a.canonical?'✓ ':''}设为主要参考</span></div><div class="assetpreview">${assetPreview(a)}</div><div class="asset-statusline">${probing?'正在读取文件信息……':previewOk?'预览已就绪':'当前文件无法预览，请更换格式。'}${a.duration?` · ${a.duration.toFixed(1)} 秒`:''}${a.dimensions?` · ${a.dimensions.join(' × ')}`:''}</div><div class="two"><label><span>绑定类型</span><select data-asset-id="${a.id}" data-asset-field="binding">${options(bindingOptions,a.binding)}</select></label><label><span>绑定对象</span><select data-asset-id="${a.id}" data-asset-field="entity">${options([...sc.characters.map(c=>[c.id,c.identity]),['foyer','门厅'],['room','房间'],['backyard','后院'],['style','全局风格']],a.entity)}</select></label></div><label><span>作为哪一种参考</span><select data-asset-id="${a.id}" data-asset-field="role">${options(roleOptions,a.role)}</select></label>${a.type!=='image'?`<div class="two"><label><span>从第几秒开始</span><input type="number" min="0" step="0.1" data-asset-id="${a.id}" data-asset-field="trimStart" value="${a.trimStart||0}"></label><label><span>到第几秒结束</span><input type="number" min="0.1" step="0.1" data-asset-id="${a.id}" data-asset-field="trimEnd" value="${a.trimEnd||5}"></label></div>`:''}<label class="checkrow"><input type="checkbox" data-asset-id="${a.id}" data-asset-field="authorized" ${a.authorized?'checked':''}>我已确认自己有权使用这份素材</label><label class="checkrow"><input type="checkbox" data-asset-id="${a.id}" data-asset-field="canonical" ${a.canonical?'checked':''}>设为主要参考素材</label><label><span>来源说明</span><input data-asset-id="${a.id}" data-asset-field="source" value="${esc(a.source)}"></label><div class="row">${btn('替换文件','replace-asset',a.id,'small')}${btn('移除','remove-asset',a.id,'small danger')}${btn('查看使用位置','asset-detail',a.id,'small')}</div></article>`}).join('')||empty('还没有素材。你可以分别上传图片、声音或视频。')}</div>`}
function renderSkills(){const sc=editScenario();const isPlatform=S.ui.skillsScope==='platform';const keys=isPlatform?PLATFORM_SKILLS:Object.keys(sc.mechanics);return `<h1>技能</h1><p class="muted">这里管理故事会使用的能力。Skill 名保留技术原名；运行细节只在开发者页面查看。</p><div class="tabs">${btn('平台技能','skills-scope','platform',isPlatform?'active':'')}${btn('玩法技能','skills-scope','mechanics',!isPlatform?'active':'')}</div><div class="grid">${keys.map(k=>{const cfg=isPlatform?S.skills[k]:sc.mechanics[k];return `<article class="card"><div class="row"><h3 class="grow">${k}</h3>${badge(cfg.enabled?'已启用':'已停用')}</div><p>${SKILL_DESCRIPTIONS[k]}</p><div class="row">${btn('查看说明','skill-detail',k,'small')}${btn('配置','skill-config',k,'small')}${btn(cfg.enabled?'停用':'启用',isPlatform?'toggle-skill':'toggle-mechanic',k,cfg.enabled?'small':'small primary')}${btn('查看调用记录','skill-logs',k,'small')}</div></article>`}).join('')}</div>`}
function playerStateCard(){const s=session();return `<div class="card"><h3>角色与已知状态</h3><div class="kv"><div>当前位置</div><div>${esc(s.world.location)}</div><div>Alice 信任</div><div><b id="alice-trust">${s.world.relationships.alice}</b> / 100</div><div>背包</div><div id="player-inventory">${s.world.inventory.map(x=>badge(x)).join(' ')||'空'}</div><div>体力</div><div>${s.world.health} / 100</div><div>已知事实</div><div>${s.world.knowledge.map(k=>`<div>${esc(k)}</div>`).join('')}</div><div>线索</div><div>${Object.entries(s.world.clues).map(([k,v])=>`${esc(k)} ${badge(v)} ${btn('验证线索','verify-clue',k,'small',v!=='DISCOVERED')}`).join('<br>')||'尚未发现线索'}</div></div>${s.world.inventory.includes('Apartment Key')?`<div class="spacer"></div>${btn('使用钥匙检查档案柜','use-key','','small')}`:''}</div>`}
function intentReceipt(){const s=session(),a=s.action,i=a?.intent||s.lastIntent;if(!i)return '';const editing=a?.status==='MEDIUM_EDIT'||a?.status==='CLARIFICATION';return `<div class="card"><div class="row"><h3 class="grow">对你意图的理解</h3>${badge(i.desire_source)}${S.ui.dev?badge('confidence '+i.confidence):''}</div><div class="kv"><div>原始输入</div><div>${esc(i.raw_text)}</div><div>Action</div><div>${esc(i.action)}</div><div>Desire</div><div>${esc(i.desire||'未知；你没有明确说明')}</div><div>Strategy</div><div>${esc(i.strategy||'未指定')}</div></div>${a?.status==='MEDIUM_ECHO'?`<p class="muted" style="margin-top:8px">这只是推断；会继续执行，你可以在执行前纠正。</p>${btn('修改理解','edit-intent','','small')}${btn('按此继续','confirm-intent','','small')}`:''}${a?.status==='CLARIFICATION'?note('你是希望保护／劝说 Alice，还是采取其他行动？这会影响重大后果，请先说明。','warn'):''}${editing?`<div class="divider"></div>${input('intent-action','你实际想做的行动',i.action)}${input('intent-desire','你明确的目的（可留空）',i.desire||'')}${input('intent-strategy','策略／限制（可留空）',i.strategy||'')}<div class="row">${btn('确认并继续','apply-intent','','primary')}${btn('取消，不执行','cancel-action')}</div>`:''}</div>`}
function renderPlayer(){const s=session();if(!s)return `<h1>Player Mode</h1>${empty('尚未开始游玩。请从故事库选择一个已发布的世界。')}${btn('前往故事库','nav','home','primary')}`;const arc=currentArc(),p=s.player;if(arc.status==='CLOSED')return renderEnding();const recs=visibleRecommendations(),busy=!!(s.action||s.selected),timed=s.timed;return `<div class="row"><div class="grow"><h1>${esc(s.snapshot.title)}</h1><p class="muted">你扮演 ${esc(s.snapshot.characters.find(c=>c.id===s.snapshot.playerCharacter)?.identity||'玩家')} · Arc ${arc.number}</p></div>${btn('Wish / 许愿','wish-drawer')}${btn('暂停并回故事库','leave-player','','small')}</div><div class="card"><div class="video"><div class="stamp">模拟视频画面 · 不是真实生成视频</div><div class="vstate">${badge(p.status)}</div><h2>${esc(p.sceneTitle)}</h2><p>${esc(p.sceneText)}</p><div class="caption">${esc(p.caption)}</div><div class="sceneid">${S.ui.dev?esc(p.branchId||'opening'):'AI 互动内容原型'}</div></div><progress id="video-progress" value="${p.position}" max="${p.duration}" aria-label="模拟视频播放进度"></progress><div class="row"><span class="muted"><span id="video-elapsed">${p.position.toFixed(1)}</span> / ${p.duration} s · 剩余 <b id="video-seconds">${Math.max(0,p.duration-p.position).toFixed(1)}</b> 秒</span><div class="right row">${btn(p.paused?'继续播放':'暂停播放','toggle-play','','small',p.status==='LOADING'||p.status==='ENDED')}${btn('跳过并查看摘要','skip-summary','','small')}${S.ui.dev?btn('跳过，不看摘要','skip-no-summary','','small'):''}</div></div>${s.selected?note(`行动已选择。${s.selected.phase==='SELECTED'?'正在确认下一幕。':s.selected.phase==='PROVISIONAL'?'下一幕已准备，当前公共尾段继续播放。':'正在验证可播放性。'} ${btn('取消此选择','cancel-action','','small')}`):''}${p.position>=p.lead&&p.position<p.duration?note('下一轮决策窗口已打开；当前公共片段仍在播放，选择不会提前改变这段画面。'):''}${p.status==='READY'&&!busy&&!timed?.active?'<p class="muted">停留在中性边界画面。普通剧情 UNTIMED：可以一直思考，不会自动选择，也不会扣除故事时间。</p>':''}</div>
 ${timed?.preparing?note('限时互动正在准备，倒计时尚未开始。选项就绪后才进入 TIMED。'):''}${timed?.active?`<div class="card"><div class="row"><h2 class="grow">${timed.kind==='qte'?'Alice 突然挥动手中的刀':'Alice 等待你立刻回答'}</h2>${badge('TIMED','warn')}</div><div class="countdown" id="qte-count" aria-live="polite">${Math.ceil(timed.remaining)}</div><p>超时将执行：${esc(timed.fallback)}（此结果预先固定）</p><div class="row">${(s.epoch?.readyIds||[]).map(id=>s.branches.find(b=>b.id===id)).filter(b=>b?.status==='READY').map(b=>btn(esc(b.label),'timed-choice',b.id,'primary')).join('')}</div></div>`:''}${timed?.result?note('限时互动结果：'+esc(timed.result),'warn'):''}
 <div class="card"><div class="row"><h3 class="grow">你准备怎么做？</h3>${badge(timed?.active?'TIMED':'UNTIMED')}</div><div class="recommendations" id="recommendations">${recs.map(b=>`<button class="primary" data-action="select-branch" data-id="${b.id}" data-ready="true">${esc(b.label)}${S.ui.dev?`<small style="color:#e5edf3">READY · ${b.id} · 直接复用该 Branch</small>`:''}</button>`).join('')}</div>${!recs.length&&!busy&&!timed?.active?`<p class="muted">${p.position<p.lead?'当前公共片段还在播放，建议将在决策窗口内出现。':'暂时没有可用的系统建议。你仍然可以输入自己的行动。'}</p>${p.position>=p.lead?btn('重新准备建议','prepare-recs','','small'):''}`:''}${busy?`<div class="banner"><b>${s.action?esc(({JEV_ANALYZING:'正在理解你的行动',DIRECTOR_PLANNING:'正在组织世界回应',GENERATING:'正在准备新的一幕',IN_FLIGHT_HIT:'正在等待已匹配的内部任务',MEDIUM_ECHO:'请留意可纠正的理解回显',MEDIUM_EDIT:'正在修改理解',CLARIFICATION:'等待你澄清行动'})[s.action.status]||s.action.status):'你的行动已被选择'}</b>${s.action?.branchId?`<div>${esc(stagePlayerText(s.branches.find(b=>b.id===s.action.branchId)?.phase))}</div>`:''}<div class="muted">这里只显示实际 Mock 阶段，不伪造后端百分比。</div>${s.action?btn('取消，保留输入','cancel-action','','small'):''}</div>`:''}<div class="divider"></div><label><span>Free-form Action / 自由行动或对话</span><textarea class="playerinput" id="free-input" placeholder="例如：我假装已经离开，然后绕到后门观察 Alice。">${esc(S.ui.inputDraft)}</textarea></label><div class="row">${btn('提交行动','submit-action','','primary',busy||!!timed?.active)}<span class="muted">自由输入始终可编辑；一次只执行一个已接受行动。</span></div>${s.lastFailedInput?note(`<b>输入已保留</b>：${esc(s.lastFailedInput)}<div class="row" style="margin-top:8px">${btn('Retry / 重试','retry-input','','primary')}${btn('修改输入','edit-failed')}${btn('返回上个决策点','restore-decision')}</div>`,'bad'):''}${detail('填写演示例子（原型辅助，不是系统推荐）',`<div class="row">${[['后门观察','我假装已经离开，然后绕到后门观察 Alice。'],['保护动机','我跟着她，但别让她发现。我是想保护她。'],['空抽屉','看一下抽屉。'],['小动作','检查桌子'],['关键录音','寻找关键录音'],['拿到钥匙','请求 Alice 把公寓钥匙交给我'],['明确等待','等一小时'],['退出矛盾','我决定离城，不再参与这场矛盾。']].map(([l,t])=>btn(l,'fill-action',t,'small')).join('')}</div>`)}${s.merge.length?note(`已提交 ${s.merge.length} 个小动作：${s.merge.map(x=>esc(x.input)).join('；')} ${btn('生成探索过渡','merge-actions','','small')}`):''}</div>
 ${intentReceipt()}<div class="two">${playerStateCard()}<div><div class="card"><h3>当前愿望</h3>${s.wishes.length?s.wishes.slice(-4).map(w=>`<div class="notice">${esc(w.raw)} ${badge(w.status)}<br><small>${esc(w.effective_boundary)}</small></div>`).join(''):empty('没有愿望。你可以随时表达对未来剧情的偏好。')}${btn('查看 / 修改愿望','wish-drawer','','small')}</div><div class="card"><h3>最近反馈</h3>${s.messages.slice(0,5).map(m=>`<div class="notice">${esc(m.text)}</div>`).join('')||'<p class="muted">你的行动、明确后果和技术反馈会出现在这里。</p>'}</div></div></div><div class="card"><div class="row"><div class="grow"><b>这个篇章可以真正结束</b><div class="muted">你可以继续探索，也可以决定告别或退出矛盾。</div></div>${btn('与 Alice 告别','request-ending','','small')}${btn('退出当前矛盾','request-consequence','','small')}</div></div>`}
function stagePlayerText(stage){return {PREDICTED:'行动已接受',PLANNING:'正在准备故事',NARRATIVE:'正在组织对白与行动',PRODUCTION:'正在准备镜头和参考',GENERATING:'正在生成片段',ASSEMBLING:'正在装配下一幕',RETRYING:'当前片段失败，正在有限重试',READY:'下一幕已就绪',FAILED:'生成失败'}[stage]||stage||'准备中'}
function renderEnding(){const s=session(),a=currentArc(),c=a.closure;return `<h1>第 ${a.number} 篇章已结束</h1>${note('这个篇章已经完整结束，但世界、关系和已经发生的事实都还会保留。')}<div class="card"><div class="video"><h2>${esc(c.title)}</h2><p>${esc(c.text)}</p></div><div class="divider"></div><div class="row">${btn('继续这个世界','continue-world','','primary',!!s.continuationTask)}${btn('保存并返回故事库','leave-player')}${btn('记录体验反馈','nav','feedback')}</div>${s.continuationTask?note('正在准备新的篇章……'):''}${s.continueBlocked?note(esc(userMessage(s.continueBlocked)),'bad'):''}<h3 style="margin-top:18px">会继续保留</h3><div class="kv"><div>与 Alice 的关系</div><div>${s.world.relationships.alice}</div><div>背包</div><div>${s.world.inventory.map(x=>esc(userItemName(x))).join(' / ')||'空'}</div><div>已经知道的事实</div><div>${s.world.knowledge.map(esc).join('<br>')||'暂无'}</div><div>继续状态</div><div>${budgetAvailable()>0?'可以继续创建下一篇章':'当前资源不足，可以先保存世界'}</div></div>${detail('下一篇章预览',`<p><b>新的核心问题：</b>离开雨夜公寓之后，你们将如何面对这些事实？</p><p><b>新的主要冲突：</b>尊重彼此新的生活边界，与处理仍然相关的证据之间的冲突。</p><p>关系、已知事实、素材和仍然适用的未结事项会继续保留。</p>`)}</div><div class="card"><h3>本篇章关键行动</h3>${table(['行动','处理方式','回顾'],s.turns.filter(t=>s.events.find(e=>e.id===t.event)?.arc===a.id).map(t=>`<tr><td>${esc(t.input)}</td><td>${userResponseMode(t.mode)}</td><td>${t.branch_id?btn('回顾片段或摘要','replay-scene',t.branch_id,'small'):'文字反馈'}</td></tr>`))}<div class="row" style="margin-top:12px">${btn('导出本局路径清单','export-linear','','small')}${s.linearExport?.status==='READY'?btn('查看路径清单','download-linear','','small'):''}</div></div><div class="card"><h3>篇章历史</h3>${s.arcs.map(x=>detail('第 '+x.number+' 篇章 · '+esc(x.question)+' · '+userArcStatus(x.status),`<p>${esc(x.conflict)}</p>${x.closure?`<p>${esc(x.closure.text)}</p>`:''}`)).join('')}</div>`}
function renderFeedback(){return `<h1>玩家体验反馈</h1>${note('反馈由实际试玩者填写。未收集时保持空白，不预填满意度，也不用自动戏剧评分代替感受。')}<div class="card"><div class="two">${input('feedback-name','匿名标识（可留空）','')}${select('feedback-relation','与团队关系',[['','请选择'],['external','外部体验者'],['team','团队成员自测']], '')}${select('feedback-guided','是否被引导',[['','请选择'],['no','自主试玩'],['yes','跟随演示引导']], '')}${select('feedback-liked','是否喜欢',[['','请选择'],['yes','喜欢'],['mixed','有喜欢也有不喜欢'],['no','不喜欢']], '')}</div>${area('feedback-reasons','为什么？具体哪段让你想继续或退出？','')}${input('feedback-turn','关联片段 / 行动（可留空）',session()?.player.sceneTitle||'')}${select('feedback-continue','是否想继续',[['','请选择'],['yes','想继续'],['no','不想继续'],['unsure','不确定']], '')}${btn('提交体验反馈','save-feedback','','primary')}</div><div class="card"><h3>已收集记录 · ${S.feedback.length}</h3>${S.feedback.length?S.feedback.map(f=>detail(`${esc(f.name||'匿名')} · ${date(f.at)} · ${esc(f.liked)}`,`<p>${esc(f.reasons)}</p>${json(f)}${btn('删除此条记录','delete-feedback',f.id,'small danger')}`)).join(''):empty('尚未收集反馈；叙事喜好未评估。')}</div>`}

function renderDeveloper(){let body;const tab=S.ui.devTab;if(['router','runtime','qa','trace','metrics'].includes(tab)||session()){const fn={branches:renderBranches,world:renderWorld,drama:renderDrama,cache:renderCache,router:renderRouter,runtime:renderRuntime,production:renderProduction,assembly:renderAssembly,trace:renderTrace,metrics:renderMetrics,qa:renderQA}[tab]||renderBranches;body=fn()}else body=empty('先开始一个游玩会话，才能观察运行中的分支与世界状态。');return `<div class="card"><div class="devhead"><h2>Developer Console</h2>${badge('MOCK ONLY','warn')}</div><div class="muted">开发信息与隐藏真相仅在此视图出现。关闭 Developer Mode 后不会出现在玩家主界面。</div><div class="devtabs">${DEV_TABS.map(([k,t])=>btn(t,'dev-tab',k,tab===k?'active':'')).join('')}</div></div>${body}`}
function renderBranches(){const s=session(),e=s.epoch,active=e?e.ids.map(id=>s.branches.find(b=>b.id===id)):s.branches.slice(-6);return `<div class="card"><h3>Speculative Generation ${req('FR-018 / 065 / 069–073')}</h3><div class="three">${select('target-k','Target K',[1,2,3],S.settings.targetK)}${select('provider-concurrency','并发上限（锁 K 前）',[1,2,3],S.settings.concurrency)}${select('shots-count','每分支镜头数',[1,2,3],S.settings.shots)}</div><div class="row">${btn('重新锁 K 并行生成','prepare-recs','','primary',!!s.action||!!s.selected)}${btn('下一批 C 失败两次','arm-branch-fail','','small')}${btn('下一次播放失败','arm-playback-fail','','small')}${btn('测试联合提交失败','arm-commit-fail','','small')}</div><p class="muted">先按预算与并发确定 K，然后 K 条 Branch 同时启动。镜头数独立于分支数。分支失败仅快速重试 1 次。</p>${S.injections.branchFail?note('已设置：下一批最后一条分支连续失败两次。','warn'):''}${S.injections.playback?note('已设置：下一次选择在可播放性校验时失败并回滚。','warn'):''}${e?`<div class="kv"><div>Epoch</div><div class="mono">${e.id}</div><div>Selected / Effective K</div><div>${e.k} / ${e.effectiveK} ${badge(e.status)}</div><div>Ready Gate</div><div>${e.published?'原子发布 '+(e.readyIds?.length||0)+' 条':'尚未发布'} · ALL_READY_BEFORE_PUBLISH</div><div>原因</div><div>${esc(e.reason)}</div></div>`:note('当前无活动推荐集。已选择、自由输入或 Arc 关闭时会撤回原集合。')}
 ${table(['Branch / 行动','Probability / Rank','状态','重试 / 操作'],[...active.map(b=>`<tr><td><b>${b.id}</b><br>${esc(b.label)}<br><small>parallel start ${b.started.toFixed(0)} ms</small></td><td>${b.probability.toFixed(2)}<br>Jev Rank ${b.rank}</td><td>${badge(b.status)}<br><small>${b.pipelineEvents.map(p=>p.phase).join(' → ')}</small></td><td>${b.retry} / 1<br>${btn('Contract','branch-contract',b.id,'small')}${btn('Trace','branch-trace',b.id,'small')}${['READY','STALE_CANDIDATE'].includes(b.status)?btn('选择','select-branch',b.id,'small',!validBranch(b).ok||!!s.action||!!s.selected):''}</td></tr>`),'<tr><td>OTHER / 玩家计划外行为</td><td>0.05 / 未校准</td><td>不预生成媒体</td><td>自由输入入口</td></tr>'])}<small>Probability 为预设、未校准的排名演示值，不是实际玩家行为概率。</small></div>

function renderAssembly(){const b=productionBranch();const shots=b?.assemblyDraft||b?.shots||[];return `<div class="card"><h3>Video Assembly ${req('FR-024')}</h3>${branchPicker()}${note('编辑产生独立装配预览，不改写已经冻结的 Branch Contract 或已提交的媒体。没有真实转码或 FFmpeg。')}${shots.map((sh,i)=>`<div class="card"><div class="row"><h4 class="grow">Shot ${i+1} · ${esc(sh.title)}</h4>${btn('↑','shot-up',b.id+':'+i,'small',i===0)}${btn('↓','shot-down',b.id+':'+i,'small',i===shots.length-1)}${btn('预览','shot-detail',b.id+':'+sh.id,'small')}</div><div class="two"><label><span>Trim Start (s)</span><input type="number" step=".1" min="0" max="${sh.duration}" data-shot-branch="${b.id}" data-shot-index="${i}" data-shot-field="trimStart" value="${sh.trimStart}"></label><label><span>Trim End (s)</span><input type="number" step=".1" min="0" max="${sh.duration}" data-shot-branch="${b.id}" data-shot-index="${i}" data-shot-field="trimEnd" value="${sh.trimEnd}"></label><label><span>Transition</span><select data-shot-branch="${b.id}" data-shot-index="${i}" data-shot-field="transition">${options(['cut','fade','dissolve'],sh.transition)}</select></label><label><span>Audio</span><select data-shot-branch="${b.id}" data-shot-index="${i}" data-shot-field="audio">${options(['native','mute','fade-in-out'],sh.audio)}</select></label></div><label><span>Subtitle</span><textarea data-shot-branch="${b.id}" data-shot-index="${i}" data-shot-field="subtitle">${esc(sh.subtitle)}</textarea></label></div>`).join('')||empty('先生成一条至少含两个 Shot 的分支。')}<div class="row">${btn('Assemble','assemble',b?.id||'','primary',!shots.length||!!b?.manualAssembly)}${btn('模拟字幕 / 音轨错误','arm-assembly-fail','','small')}${b?.assemblyResult?badge(b.assemblyResult.status):''}</div>${b?.assemblyResult?json(b.assemblyResult):''}</div>`}
function renderTrace(){const filter=S.ui.traceFilter||'all';const query=(S.ui.traceQuery||'').toLowerCase();const logs=S.logs.filter(l=>(filter==='all'||filter==='skills'&&SKILL_DESCRIPTIONS[l.name]||filter==='errors'&&/FAIL|REJECT|BLOCK|ROLLBACK/.test(l.status)||l.branch_id===filter||l.name===filter)&&(!query||JSON.stringify(l).toLowerCase().includes(query))).slice(-90).reverse();const b=session()?.branches.find(b=>b.id===filter)||productionBranch();return `<div class="card"><h3>Decision / Branch Developer Trace ${req('FR-015 / 030 / 066–070 / 082')}</h3><div class="progresssteps">${['Player Action','Jev Observation','Director','Drama Control','Narrative','Production','H3','Assembly','Branch Ready','Selection','Commit'].map(x=>`<span>${x}</span>`).join('')}</div><div class="row" style="margin-top:12px"><select id="trace-filter">${options([['all','全部 Trace'],['skills','仅 Skills'],['errors','仅失败 / 回滚'],...(session()?.branches||[]).slice(-30).map(b=>[b.id,b.id])],filter)}</select><input id="trace-query" placeholder="搜索输入、状态、Provider…" value="${esc(S.ui.traceQuery||'')}">${btn('导出脱敏 Mock Trace','export-trace','','small')}</div>${b?`<div class="row" style="margin-top:10px">${btn('WorkingContext','context-detail',b.id,'small')}${btn('ScenePacket','packet-detail',b.id,'small')}${btn('模拟越权泄密','arm-leak','','small')}</div>`:''}</div><div class="card"><h3>Skill / Agent / Runtime Invocation Log</h3><p class="muted">MOCK · duration 为模拟阶段用时。只记录公开输入、输出、规则与工件，不包含隐藏推理。</p>${logs.length?table(['Time / Invocation','Status / Duration','Provider / Downstream','展开'],logs.map(l=>`<tr class="logrow"><td>${date(l.at)}<br><b>${esc(l.name)}</b><br><small>${l.branch_id||l.trace_id}</small></td><td>${badge(l.status)}<br>${l.duration_ms} ms (mock)</td><td>${esc(l.provider)}<br>→ ${esc(l.downstream_target)}</td><td>${btn('Input / Output','log-detail',l.id,'small')}</td></tr>`)):empty('当前筛选下没有调用日志。')}</div>`}
function renderMetrics(){const s=session();const waits=s?.metrics.waitSamples||[];const mean=waits.length?Math.round(waits.reduce((a,x)=>a+x.duration_ms,0)/waits.length):null;return `<div class="card"><h3>Budget / Permission ${req('FR-034')}</h3>${note('所有 credits 是原型测试额度，不对应人民币或真实 API 价格。预留发生在投递之前；已模拟消费的费用不会因取消自动退还。','warn')}<div class="two">${input('budget-total','Session 总上限',s?.budget.total??S.settings.total,'number')}${input('budget-turn','单轮上限',S.settings.perTurn,'number')}${input('budget-spec','投机上限',S.settings.specCap,'number')}${select('budget-concurrency','视频分支并发上限',[1,2,3],S.settings.concurrency)}</div><label class="checkrow"><input id="allow-cloud" type="checkbox" ${S.settings.allowCloud?'checked':''}>允许 Mock 云端处理（权限测试；不会真的上传）</label>${s?`<label class="checkrow"><input id="allow-media" type="checkbox" ${s.allowMedia?'checked':''}>当前会话允许创建新媒体 / 续杯任务</label>`:''}<div class="row">${btn('应用预算配置','apply-budget','','primary')}${btn('模拟额度耗尽','exhaust-budget','','small')}${btn('恢复演示额度','restore-budget','','small')}</div>${s?`<div class="metrics" style="margin-top:12px"><div>Spent<div class="stat">${s.budget.spent}</div></div><div>Reserved<div class="stat">${s.budget.reserved}</div></div><div>Available<div class="stat">${budgetAvailable()}</div></div><div>Spec spent<div class="stat">${s.budget.specSpent}</div></div></div>${detail('预算账本',json(s.budget.ledger.slice(-30)))}`:''}</div><div class="card"><h3>Prototype Metrics ${req('FR-031 / 072')}</h3><p class="muted">仅统计这份 HTML 的模拟操作。不能用于声称模型延迟、真实成本节省、SLA 或玩家满意度。</p>${s?`<div class="metrics">${[['Ready hits',s.metrics.readyHits],['Free misses',s.metrics.freeMiss],['In-flight hits',s.metrics.inflightHit],['Rollbacks',s.metrics.rollbacks],['Quick',s.metrics.quick],['Merged',s.metrics.merged],['Full',s.metrics.full],['K reduced',s.metrics.kReduced],['Known receipts',s.receipts.length],['Feedback',S.feedback.length]].map(([k,v])=>`<div>${k}<div class="stat">${v}</div></div>`).join('')}</div><p style="margin-top:12px">选择 → 首帧 / Mock UI 平均耗时：${mean==null?'尚无样本':mean+' ms'}。${waits.length} 个本地样本，无 P95 验收阈值。</p>${detail('各阶段 Trace Timing',json(S.logs.filter(l=>l.session_id===s.id&&l.duration_ms).slice(-20).map(l=>({stage:l.name,duration_ms:l.duration_ms,provider:l.provider,branch:l.branch_id,kind:'SIMULATED_PHASE'}))))}`:empty('开始游玩后记录本地交互指标。')}<p class="muted">真实 Provider latency、TTFT、GPU 内存、输出语义质量：NOT MEASURED。真实喜好结论：由体验反馈内容决定，不自动判定。</p></div>`}
</script><script>
const AT_DEMOS={1:'creator',2:'assets',3:'assembly',4:'ready',5:'free',6:'quick',7:'wish',8:'cache',9:'proposal',10:'ready',11:'assembly',12:'key',13:'ending',14:'provider',15:'rollback',16:'recovery',17:'budget',18:'local',19:'trace',20:'trace',21:'normal',22:'normal',23:'qte',24:'preference',25:'branchfail',26:'trace',27:'twist',28:'quick',29:'pressure',30:'low',31:'trace',32:'merge',33:'twist',34:'twist',35:'pressure',36:'ending',37:'wish',38:'consequence',39:'ending',40:'proposal',41:'trace',42:'wish',43:'creator',44:'feedback',45:'free',46:'ready',47:'trace',48:'trace',49:'ready',50:'rollback',51:'trace',52:'branchfail',53:'provider',54:'provider',55:'cache',56:'profile',57:'profile',58:'profile',59:'provider',60:'cache'};
function renderQA(){const query=(S.ui.qaSearch||'').toLowerCase();const tests=AUDIT.tests.filter(t=>t.join(' ').toLowerCase().includes(query));return `<div class="card"><h3>QA 验收台</h3><p>源 PRD：<b>${AUDIT.coverage.length} FR / ${AUDIT.tests.length} AT / ${AUDIT.decisions.length} Q</b>。</p>${note('本页区分前端原型验收与真实后端验收。AT 中“真实调用、真实 GPU、成片效果”等要求在这里一律未运行；不能用 Mock 通过代替产品通过。','warn')}<div class="row">${btn('运行内置状态不变量检查','run-checks','','primary')}${btn('需求覆盖矩阵','coverage-page','','small')}${btn('导出手工验收记录','export-qa','','small')}</div>${S.lastChecks?`<p class="muted">最近检查 ${date(S.lastChecks.at)} · ${S.lastChecks.results.filter(r=>r.pass).length}/${S.lastChecks.results.length} 项通过（仅前端）。</p>${S.lastChecks.results.map(r=>`<div>${badge(r.pass?'PASS':'FAIL')} ${esc(r.name)} ${r.error?esc(r.error):''}</div>`).join('')}`:'<p class="muted">内置检查尚未运行。</p>'}${detail('交付前浏览器测试记录',json(S.browserValidation||BUILD_VALIDATION))}</div><div class="card"><h3>AT-01–60 · 手工复验</h3><input class="qa-search" id="qa-search" placeholder="搜索 AT、需求或异常…" value="${esc(S.ui.qaSearch||'')}">${tests.map(t=>{const state=S.qa[t[0]]||{};const demo=AT_DEMOS[Number(t[0].split('-')[1])];return detail(`${t[0]} · ${esc(clean(t[1]))} ${badge(state.status||'NOT RUN')}`,`<p><b>PRD 预期：</b>${esc(clean(t[2]))}</p><p class="muted">${esc(clean(t[3]))}</p><div class="row">${btn('打开前端演示路径','demo',demo,'small')}<select data-qa-id="${t[0]}" data-qa-field="status">${options(['NOT RUN','FRONTEND PASS','FRONTEND FAIL','BLOCKED'],state.status||'NOT RUN')}</select></div><label style="margin-top:10px"><span>复验观察 / 问题 / 辅助情况</span><textarea data-qa-id="${t[0]}" data-qa-field="notes">${esc(state.notes||'')}</textarea></label><div class="muted">真实后端验收：NOT RUN · 此 HTML 未发起任何真实模型／GPU／FFmpeg 请求。</div>`)}).join('')}</div>`}
function renderNotes(){const tab=S.ui.notesTab||'guide';return `<h1>Prototype Notes</h1><div class="tabs">${[['guide','使用与边界'],['decisions','决策与冲突记录'],['coverage','Feature Coverage Matrix']].map(([k,t])=>btn(t,'notes-tab',k,tab===k?'active':'')).join('')}</div>${tab==='coverage'?renderCoverage():tab==='decisions'?renderDecisionNotes():`<div class="card"><h2>交付范围</h2><p>这是一个本地、离线、自包含的前端状态机。所有模型输出、Provider 健康、GPU Profile、视频任务、装配、技能调用、费用与性能均为 Mock。用户填写的字段、本地素材预览、表单校验、按钮、状态转换、存档与反馈记录是真正的浏览器交互。</p><p>源文件：<span class="mono">${esc(AUDIT.source)}</span><br>源文件 SHA-256：<span class="mono">${AUDIT.sha256}</span></p><p>完整阅读与审计范围：Q01–Q70、I01–I05、FR-001–082、AT-01–60，以及世界／戏剧状态、Provider、Runtime、缓存、预算、权限、素材和呈现契约。覆盖矩阵在 HTML 编码前建立，并嵌入此页方便团队追踪；没有另交矩阵文件。</p></div><div class="card"><h2>建议走查路径</h2><p><b>Creator：</b>Home → Create Scenario → 输入想法 → Generate Scenario → 修改角色或戏剧字段 → Assets 上传图／声／视频 → 绑定和授权 → Validate & Publish → 发布并试玩。</p><p><b>Player：</b>开场播放 → 最后 4 秒出现 Ready 建议 → 提前选择 → 公共尾段继续 → 下一幕开始。自由输入“假装离开，再绕到后门观察”，然后试试空抽屉、连续检查、关键录音、许愿和告别。</p><p><b>Developer：</b>打开 Developer Mode → Branches 查看并行生成 → 注入 C 失败两次 → 查看 K-1 发布 → 注入播放失败看回滚 → Router 测试固定 fallback → Runtime 切换 Profile → Production 运行显式本地任务。</p><p><b>Ending：</b>告别或退出矛盾 → Arc Completed → 查看回顾 → Continue This World → 检查关系、已知事实、背包、原结局和费用仍然保留。</p><p>Developer > Prototype Controls 可以直接进入这些路径。状态跳转是测试辅助，带有“Mock fixture”标记的预置证据不是玩家自然游玩的历史。</p></div><div class="card"><h2>具体 Mock 实现选择</h2><p><b>自然语言：</b>关键词规则与预设内容模拟意图理解和剧情生成；任意输入会保留原文并创建独立 Branch，不声称真正理解了任意开放式故事。中置信回显默认约 2.2 个模拟秒后继续，点击“修改理解”会暂停等待；低置信高影响必须确认。</p><p><b>素材：</b>使用 FileReader 与浏览器 image / audio / video 预览，支持绑定、裁选区间、Replace、Remove 和 Canonical 标记。没有真实上传、转码、音色克隆或媒体语义检测。浏览器可读取的元数据不等于 ffprobe 或供应商校验。12 MB 是原型本地预览上限；大于约 180 KB 的 data URL 不写入自动存档，刷新后明确提示重新选择。</p><p><b>Scenario Package：</b>离线 JSON 外壳包含 Manifest、Typed World / Drama / Character / Mechanic / Asset / Theme 数据。导入不会执行代码。不模拟 ZIP 解压或完整 YAML 文件系统；发布创建不可变快照。导出是用户主动点击时由浏览器生成的 JSON。</p><p><b>预算：</b>每 Shot 5 个虚构 credits、初始总额 500、默认投机上限 160、TTL 180 模拟秒，都是可调整测试值，不是 PRD 冻结常数、价格或 SLA。费用在视频任务投递时记账；尚未投递的预留可释放。</p><p><b>指纹：</b>使用声明 read set 的确定性 FNV-1a 演示依赖校验，明确标记 mock-fnv1a，不假称安全哈希。偏好／排名元数据不进事实指纹；相关 World、Wish、Assets、Skills、Contract 和 Arc 变化会失效。</p><p><b>两阶段：</b>SELECTED 后建立独立 PROVISIONAL view，并创建 N+2 文本计划；确认首帧可播放后联合提交 World / Drama / Event。失败回滚，依赖计划取消。正式线索知情另由呈现回执建立。跳过并查看摘要也形成回执；明确“不看摘要”不建立新知识。</p><p><b>三档反馈：</b>Quick 不发媒体任务；多个小动作先各自提交，再选择合并呈现，不能再次执行道具或时间变化。Full 创建新 Branch 并模拟视频。普通停留、播放暂停与 API 等待不推进故事时间。</p><p><b>存档：</b>localStorage 只保存在当前浏览器；不同浏览器或移动文件路径可能具有不同存储范围。刷新后未提交的选择回滚、在途生成标记中断、原文保留，不盲目重复投递。限时事件刷新后按原 fallback 处理。存储不可用时会提示，并可手动导出存档。</p><p><b>功能级别：</b>四种 Mechanic 均提供 UI 和规则 Mock；更多题材与主题通过复制 Scenario / 受控配置模拟。P1 线性导出提供已观看路径清单与装配状态，不生成 MP4。所有真实后端 AT 仍为 NOT RUN。</p></div><div class="card"><h2>不作为正式产品默认功能的辅助项</h2><p>Prototype Control Panel、故障注入、手工切换 Wish 生命周期、补齐已呈现证据夹具、模型 Contract 版本递增、阶段标签覆盖与内置 QA 检查，都是开发／排练辅助。所有参数来自当前 HTML，不会连接真实服务。</p><p>开发视图是角色切换演示，不是账号认证系统。此文件包含创作者与开发者要审阅的隐藏设定；无法充当生产环境的客户端保密边界。普通 Player 界面只显示已知内容。</p></div>`}`}
function renderDecisionNotes(){return `<div class="card"><h2>冲突与优先级处理</h2><p><b>N01 · 推荐集合原子发布。</b>本次任务的例子允许 A / B 先出现、C Ready 后追加；但唯一依据 PRD 的 FR-073、08.2、12.2、12.9 明确要求同一推荐集合原子发布。这里采用 PRD 规则：全部待发布分支 Ready 后一起显示；C 重试后仍失败则一次性发布 A / B，不逐个追加未完成的推荐。</p><p><b>N02 · Commit 与呈现顺序。</b>PRD 07.4 继承了 prepare → render → validate → commit → present 的旧派生说明；Q61、08.9、12.10 冻结了后续两阶段规则。这里以后一规则为准：选择后先 provisional，首帧可播放性确认后 canonical，知识／伏笔的可见性另用 PresentationReceipt 记录。</p><p><b>N03 · 真实执行要求与本次交付范围。</b>PRD 的真实 Skill 日志、三类素材消费、GPU 和 API 验收是最终产品要求；本次用户明确只要求前端 Mock。因此相应状态和契约可走查，但始终标为 MOCK，不将原始 AT 写成后端 PASS。</p><p><b>N04 · Narrative fallback 空缺。</b>VIDEO_LOCAL_PROFILE 卸载 Lightning 后，Step 3.7 失败没有已冻结的第二 fallback。采用明确的可恢复 BLOCKED 状态；不加 Step 5，不伪称本地回退成功。</p><p><b>N05 · 本地视频能力。</b>Sol-H3 是显式可选后端，不是 H3 错误的透明 fallback。本地多参考能力默认 UNKNOWN；独立环境镜头测试使用明确的无参考请求。要演示三参考本地路径，须勾选仅用于本原型的能力夹具。</p><p><b>N06 · Jev 故障。</b>PRD 11.6 允许 Director 保守排序／理解的 degraded mode，而模型矩阵未冻结替代 DecisionProvider。本原型按“保守 Director 工作流”标记，不增加新的 Jev fallback 模型。</p><p><b>N07 · 结局和续杯。</b>不设 Ending Readiness 分数、固定 Beat 数或软最大篇幅。原型用玩家的明确告别／退出／公开证据来演示 Director 判断；资源耗尽只暂停。新 Arc 继承状态与总预算，不撤销已关闭结局。</p></div><div class="card"><h2>Q01–Q70 决策追溯</h2>${AUDIT.decisions.map(q=>detail(`${q[0]} ${esc(clean(q[1]))} · ${esc(clean(q[2]))}`,`<p>${esc(clean(q[3]||''))}</p>`)).join('')}</div>`}
function renderCoverage(){const q=(S.ui.coverageSearch||'').toLowerCase();const rows=AUDIT.coverage.filter(r=>JSON.stringify(r).toLowerCase().includes(q));return `<div class="card"><h2>Feature Coverage Matrix</h2><p>每个 FR 都有前端承载位置、交互、状态转换和 Mock 事件。此矩阵说明覆盖路径，不宣称所有真实产品验收已经通过。</p><input class="qa-search" id="coverage-search" placeholder="搜索 FR / 页面 / 状态 / Provider…" value="${esc(S.ui.coverageSearch||'')}">${rows.map(r=>detail(`${r.id} · ${esc(clean(r.requirement))}`,`<p><b>PRD Requirement：</b>${esc(clean(r.acceptance))}</p><div class="kv"><div>User Role</div><div>${r.role}</div><div>Screen</div><div>${r.screen}</div><div>Component</div><div>${r.component}</div><div>Interaction</div><div>${r.interaction}</div><div>State Transition</div><div class="mono">${esc(r.transition)}</div><div>Mock Backend Event</div><div class="mono">${esc(r.event)}</div><div>Acceptance</div><div>${esc(clean(r.acceptance))}</div><div>Boundary</div><div>${esc(clean(r.boundary))}</div></div><div class="row" style="margin-top:10px">${btn('打开对应演示','demo',r.demo,'small')}${btn('查看 AT 验收','qa-by-fr',r.id,'small')}</div>`)).join('')}</div>`}
function modal(title,body,foot=''){modalKind=title;$('modal').innerHTML=`<div class="dialoghead"><h2>${title}</h2>${btn('关闭','close-modal','','small')}</div><div class="dialogbody">${body}</div>${foot?`<div class="dialogfoot">${foot}</div>`:''}`;if(!$('modal').open)$('modal').showModal()}

function branchContract(b){return {branch_id:b.id,recommendation_epoch:b.epoch,raw_player_input:b.intent.raw_text,player_intent:b.intent,dramatic_directive:b.directive,story_beat:b.outcome,state_patch_proposal:b.state_patch_proposal,drama_patch_proposal:b.drama_patch_proposal,video_asset:b.artifact,status:b.status,dependency_fingerprint:b.fingerprint,read_set:b.readSet,base_versions:b.base_versions,scene_packet:b.packet,working_context:b.context,provider_routes:b.routes,expiry:b.expiresAt,retry:b.retry,provenance:'MOCK only; no real backend jobs'};}

function testProposal(kind){const s=session();if(!s)return;const before=JSON.stringify({w:s.world,d:s.drama});let p={proposal_id:uid('test_proposal'),base_version:s.world.version,base_drama_revision:s.drama.revision,idempotency_key:'test:'+uid('id'),operations:[]};if(kind==='illegal')p.operations=[{op:'set',path:'truth.fact_recording',value:'illegally rewritten'}];if(kind==='stale')p.base_version=s.world.version-1;if(kind==='duplicate'){const key=s.committedKeys.at(-1);if(key)p.idempotency_key=key;else{p.idempotency_key='mock-existing-key';s.committedKeys.push(p.idempotency_key)}}const result=validateProposal(p);s.proposalTest={proposal:p,result,canonical_unchanged:before===JSON.stringify({w:s.world,d:s.drama})};log('State Manager',result.duplicate?'DUPLICATE_IGNORED':result.ok?'VALIDATED':'REJECTED',{proposal:p},s.proposalTest,'runtime');render()}
function addPresentedFixture(){const s=session();for(const [key,label] of [['key_scratches','钥匙划痕来自旧档案柜'],['recording_found','录音包含举报预约的内容']]){const e=appendEvent('MOCK_FIXTURE_PRESENTED','原型跳转夹具：'+label,[],{fixture:true});const r={id:uid('receipt'),method:'MOCK_FIXTURE',event:e.id,knowledge_refs:[key],at:Date.now()};s.receipts.push(r);if(!s.world.knowledge.includes(label))s.world.knowledge.push(label);s.world.clues[key]='DISCOVERED';const f=s.drama.foreshadows.find(f=>f.id===key);if(f){f.status='PLANTED';f.evidence.push(e.id);f.presentation.push(r.id)}}s.world.version++;s.drama.revision++;clearEpoch('explicit presented-evidence fixture');invalidateBranches('test fixture changes knowledge');reviewTwist(false);addMessage('已装载已呈现线索的 Mock 夹具，用于直接测试反转 Gate；不是自然游玩历史。','warn');}

function runDemo(id){S.ui.demo=id;S.ui.controlOpen=true;const navOnly={creator:['creator',null],assets:['assets',null],skills:['skills',null],feedback:['feedback',null],theme:['creator',null]};if(navOnly[id]){S.ui.page=navOnly[id][0];if(id==='theme')S.ui.creatorTab='theme';render();return}if(id==='normal'){startSession('rainy_apartment');S.ui.dev=false;S.ui.controlOpen=true;render();return}const s=ensureSession();S.ui.simPaused=false;if(s.action||s.selected){cancelAction();s.lastFailedInput=null;s.lastFailedBranch=null}s.player.paused=false;if(['trace','assembly','proposal','cache','budget','profile','local','provider','branchfail','rollback','preference','twist','pressure'].includes(id))S.ui.dev=true;S.ui.page='player';S.ui.confidence='auto';S.ui.response='auto';if(id==='ready'){s.player.position=Math.max(0,s.player.lead-4);s.player.status='PLAYING';s.player.paused=false;prepareRecommendations(true);S.ui.dev=true;S.ui.devTab='branches'}else if(id==='free'){S.ui.inputDraft='我假装已经离开，然后绕到后门观察 Alice。';submitAction()}else if(id==='low'){S.ui.confidence='low';S.ui.inputDraft='我想彻底解决 Alice 的问题。';submitAction()}else if(id==='medium'){S.ui.confidence='medium';S.ui.inputDraft='我跟着她，但不想引起注意。';submitAction()}else if(id==='wish'){addWish('我希望 Alice 不要死。');showWishDrawer()}else if(id==='qte'||id==='dialogue')requestTimed(id==='qte'?'qte':'dialogue');else if(id==='quick'){S.ui.inputDraft='看一下抽屉。';submitAction()}else if(id==='merge'){S.ui.inputDraft='检查桌子';submitAction();addMessage('先提交“检查桌子”，随后输入“检查柜子”“检查窗户”，再点“生成探索过渡”。')}else if(id==='full'){S.ui.inputDraft='寻找关键录音';submitAction()}else if(id==='key'){S.ui.inputDraft='请求 Alice 把公寓钥匙交给我';submitAction()}else if(id==='pressure'){S.ui.devTab='drama';S.ui.inputDraft='等一小时';addMessage('现在先观察 Fiction minutes 不因等待变化，再提交“等一小时”。')}else if(id==='twist'){S.ui.devTab='drama';addPresentedFixture();s.player.position=s.player.duration;s.player.status='READY';prepareRecommendations(true)}else if(id==='ending'){S.ui.inputDraft='我向 Alice 告别，结束这段矛盾。';s.player.position=s.player.duration;submitAction()}else if(id==='consequence'){S.ui.inputDraft='我决定离城，不再参与这场矛盾。';s.player.position=s.player.duration;submitAction()}else if(id==='provider'){S.ui.devTab='router';injectProvider('step37','timeout')}else if(id==='branchfail'){S.ui.devTab='branches';S.settings.targetK=3;S.settings.concurrency=3;S.settings.specCap=Math.max(S.settings.specCap,s.budget.specSpent+80);s.budget.total=Math.max(s.budget.total,s.budget.spent+100);S.injections.branchFail=2;s.player.position=s.player.lead;s.player.status='PLAYING';prepareRecommendations(true)}else if(id==='profile'){S.ui.devTab='runtime';requestProfile('VIDEO_LOCAL_PROFILE')}else if(id==='local'){S.ui.devTab='production';if(S.runtime.profile!=='VIDEO_LOCAL_PROFILE'){S.runtime.pendingVideo='sol';S.runtime.pendingStandalone=true;requestProfile('VIDEO_LOCAL_PROFILE')}else{S.runtime.video='sol';runStandaloneVideo()}}else if(id==='rollback'){S.ui.devTab='branches';S.injections.playback=true;s.player.position=s.player.duration;s.player.status='READY';prepareRecommendations(true);addMessage('等推荐 Ready 后点击任意一条，将演示 SELECTED → PROVISIONAL → 播放校验失败 → rollback。','warn')}else if(id==='cache'){S.ui.devTab='cache';s.player.position=s.player.lead;prepareRecommendations(true)}else if(id==='proposal'){S.ui.devTab='world';testProposal('illegal')}else if(id==='budget'){S.ui.devTab='metrics';s.budget.total=s.budget.spent+s.budget.reserved;clearEpoch('budget fixture');addMessage('已模拟预算耗尽。系统将明确暂停，不创建假剧情结局。','warn')}else if(id==='recovery'){persist();addMessage('当前状态已保存。可点击“刷新恢复演练”验证恢复与幂等。')}else if(id==='trace'){S.ui.devTab='trace';prepareRecommendations()}else if(id==='assembly'){S.ui.devTab='assembly';prepareRecommendations()}else if(id==='preference'){S.ui.devTab='world';S.ui.inputDraft='把外套递给她';addMessage('提交行动并开始下一幕后，偏好才会增加，且保留正式事件引用。')}render()}

 case 'edit-field-ai':S.ui.fieldTarget=id;modal('局部修改 / Regenerate Section',`<p class="muted">只提出 ${esc(id)} 的差异，不覆盖其他字段和素材。这里使用规则 Mock，不是真实模型生成。</p>${area('field-current','当前内容',getPath(editScenario(),id)||'')}${area('field-instruction','修改要求','把这一项改得更谨慎，但保留原先的目标与边界。')}`,btn('取消','close-modal')+btn('生成局部差异','propose-field','','primary'));break;
 case 'propose-field':{const route=routeFor('authoring',true);if(!route.selected){toast('Authoring 当前不可用，未生成修改。');break}const path=S.ui.fieldTarget,before=getPath(editScenario(),path)||'',instruction=$('field-instruction').value.trim();if(!instruction){toast('请输入修改要求。');break}let after=instruction.replace(/^(改为|改成|设置为)[：:]?/,'');if(after===instruction){if(instruction.includes('谨慎')&&path.includes('personality'))after='更谨慎，温柔外表下会先核对事实；保留原目标与边界。';else after=before+'\n创作补充：'+instruction}S.ui.fieldProposal={path,before,after};log('scenario-authoring','PATCH_PROPOSED',{path,instruction},{before,after},route.selected);modal('Review Diff / 审阅局部修改',`<div class="two"><div><b>Before</b>${json(before)}</div><div class="fielddiff"><b>After</b>${json(after)}</div></div><p>只修改 <b>${esc(path)}</b>；其他字段、已上传素材和发布快照保持不变。</p>`,btn('Reject / 拒绝','reject-field')+btn('Accept / 接受','accept-field','','primary'));break}

<script>
(function(){
var legacyRenderCreatorIA=renderCreator;
var legacyDispatchIA=dispatch;
var IA_DEV_TITLES={branches:'Branches',world:'World State',drama:'Drama Control',cache:'Branch Cache',router:'Provider Router',runtime:'Runtime Profiles',production:'Production',assembly:'Video Assembly',trace:'Trace',metrics:'Metrics',qa:'QA',prototype:'Prototype Controls'};
var IA_INSPECTOR_TITLES={branch:'Current Branch',jev:'Jev',director:'Director',drama:'Drama State',provider:'Provider',h3:'H3 Job',trace:'Trace'};

function userScenarioStatus(s){return ({PUBLISHED:'已发布',DRAFT:'草稿',ARCHIVED:'已归档'})[s]||'可用'}
function userWishStatus(s){return ({ACTIVE:'进行中',DEFERRED:'稍后处理',CONFLICTED:'与当前事实冲突',FULFILLED:'已实现',PARTIALLY_FULFILLED:'部分实现',FAILED:'未实现',SUPERSEDED:'已替换',WITHDRAWN:'已撤回'})[s]||s}
function userArcStatus(s){return ({OPEN:'进行中',CLOSED:'已结束'})[s]||s}
function userResponseMode(s){return ({QUICK_ACK:'快速回应',MERGED_TRANSITION:'探索过渡',FULL_BEAT:'完整剧情'})[s]||s}
function userMessage(s){return String(s||'').replace(/READY_HIT|Ready hit|READY/gi,'已就绪').replace(/PROVISIONAL/gi,'临时状态').replace(/CANONICAL/gi,'正式剧情').replace(/Branch/gi,'下一幕').replace(/Jev|Director|Narrative/gi,'系统').replace(/Mock|MOCK|模拟/gi,'').replace(/Arc\s*(\d+)/gi,'第 $1 篇章').replace(/\s{2,}/g,' ').trim()}
function creatorPhaseCN(i){return ['理解故事想法','搭建主要角色','设计世界设定','提炼核心问题','建立主要冲突','整理稳定真相','设置外部压力','规划结局方向','完成草案'][i]||'正在创作'}
function assetTypeCN(t){return ({image:'图片',voice:'声音',video:'视频'})[t]||t}
function playerJourneyIndex(s){const a=s.action;if(a){if(['JEV_ANALYZING','MEDIUM_ECHO','MEDIUM_EDIT','CLARIFICATION'].includes(a.status))return 0;if(a.status==='DIRECTOR_PLANNING')return 1;if(['GENERATING','IN_FLIGHT_HIT'].includes(a.status)){const b=s.branches.find(x=>x.id===a.branchId);if(!b||['PREDICTED','PLANNING','NARRATIVE'].includes(b.phase))return 1;if(['PRODUCTION','GENERATING','ASSEMBLING','RETRYING'].includes(b.phase))return 2;return 3}}if(s.selected){if(s.selected.phase==='MEDIA_VALIDATING')return 3;return 2}return -1}
function playerJourneyTitle(s){const a=s.action;if(a){if(a.status==='JEV_ANALYZING')return '正在理解你的行动';if(['MEDIUM_ECHO','MEDIUM_EDIT','CLARIFICATION'].includes(a.status))return '请确认我对你行动的理解';if(a.status==='DIRECTOR_PLANNING')return '正在生成剧情';if(['GENERATING','IN_FLIGHT_HIT'].includes(a.status)){const b=s.branches.find(x=>x.id===a.branchId);return b&&['PRODUCTION','GENERATING','ASSEMBLING','RETRYING'].includes(b.phase)?'正在生成视频':'正在生成剧情'}}if(s.selected){return s.selected.phase==='MEDIA_VALIDATING'?'下一幕已就绪，正在准备播放':'正在准备下一幕'}return ''}
function playerJourneyHTML(s){const idx=playerJourneyIndex(s);if(idx<0)return '';const labels=['理解行动','生成剧情','生成视频','准备播放'];return `<div class="action-journey"><h3>${esc(playerJourneyTitle(s))}</h3><p>${s.action?`已收到：“${esc(s.action.raw)}”`:'你的选择已经确认，其他选项已收起。'}</p><div class="journey-line">${labels.map((_,i)=>`<span class="journey-dot ${i<idx?'done':i===idx?'current':''}"></span>`).join('')}</div><div class="journey-labels">${labels.map(x=>`<span>${x}</span>`).join('')}</div></div>`}
function iaState(){
 S.ui.inspectorOpen=!!S.ui.inspectorOpen;
 S.ui.inspectorTab=S.ui.inspectorTab||'branch';
 S.ui.characterId=S.ui.characterId||'alice';
 S.ui.playerPopover=S.ui.playerPopover||null;
 if(!S.ui.page)S.ui.page='home';
}
function iaNavButton(label,action,id,active,ico,disabled,extra=''){
 return `<button class="sidebar-item ${active?'active':''} ${extra}" data-action="${action}" data-id="${esc(id||'')}" ${disabled?'disabled':''}><span class="nav-ico">${ico||'·'}</span><span class="nav-label">${esc(label)}</span></button>`;
}
function iaSidebar(){iaState();const p=S.ui.page,ct=S.ui.creatorTab,dt=S.ui.devTab,sc=editScenario(),sess=session();const creatorActive=p==='creator'||p==='assets'||p==='skills';const projects=S.library.slice(0,5);let html=`<div class="sidebar-brand"><span class="sidebar-mark">剧</span><span>互动短剧</span></div><button class="sidebar-create" data-action="new-scenario">＋ 创建故事</button>`;
 html+=`<div class="sidebar-section"><div class="sidebar-section-title">场景</div>${iaNavButton('故事库','ia-nav','home',p==='home','⌂')}${iaNavButton('当前游玩','ia-nav','player',p==='player','▶',!sess)}</div>`;
 html+=`<div class="sidebar-section"><div class="sidebar-section-title">创作</div>${iaNavButton('概览','ia-creator','overview',p==='creator'&&ct==='overview','◫')}${iaNavButton('世界','ia-creator','world',p==='creator'&&ct==='world','◎')}${iaNavButton('角色','ia-creator','characters',p==='creator'&&ct==='characters','人')}`;
 if(p==='creator'&&ct==='characters'&&sc){html+=`<div class="sidebar-subitems">${sc.characters.map(c=>iaNavButton(c.identity,'ia-character',c.id,S.ui.characterId===c.id,'·')).join('')}</div>`}
 html+=`${iaNavButton('戏剧结构','ia-creator','drama',p==='creator'&&ct==='drama','◇')}${iaNavButton('玩法机制','ia-creator','mechanics',p==='creator'&&ct==='mechanics','⚙')}${iaNavButton('素材','ia-nav','assets',p==='assets','▧')}${iaNavButton('技能','ia-nav','skills',p==='skills','⌁')}${iaNavButton('发布','ia-creator','publish',p==='creator'&&ct==='publish','↑')}</div>`;
 html+=`<div class="sidebar-section"><div class="sidebar-section-title">开发者</div>${[['branches','Branches','⑂'],['world','World State','▦'],['drama','Drama Control','◇'],['cache','Branch Cache','▤'],['router','Provider Router','⇄'],['runtime','Runtime Profiles','▣'],['production','Production','◈'],['assembly','Video Assembly','≡'],['trace','Trace','⌇'],['metrics','Metrics','∿'],['qa','QA','✓'],['prototype','Prototype Controls','⚑']].map(([k,l,i])=>iaNavButton(l,'ia-dev',k,p==='developer'&&dt===k,i)).join('')}</div>`;
 html+=`<div class="sidebar-section"><div class="sidebar-section-title">最近项目</div>${projects.map((x,i)=>iaNavButton(x.title,'ia-project',x.id,S.editId===x.id&&creatorActive,i===0?'●':'○',false,'sidebar-project')).join('')}</div>`;
 html+=`<div class="sidebar-spacer"></div><div class="sidebar-bottom">${iaNavButton('设置','ia-nav','settings',p==='settings','⚙')}<div style="padding:8px 10px 0" class="muted">${sess?'<span class="session-dot"></span> 当前故事已载入':'<span class="mock-dot"></span> 离线原型'}</div></div>`;
 return html;
}

 if(task){const step=Math.min(task.step,8);return `${head}<div class="creator-progress"><div class="spinner"></div><h2>${esc(creatorPhaseCN(step))}</h2><p>正在把你的想法整理成一个可以继续编辑的故事草案。</p><div class="creator-progress-list">${Array.from({length:9},(_,i)=>`<div class="creator-progress-row ${i<step?'done':i===step?'current':''}"><span class="dot">${i<step?'✓':i+1}</span><span>${creatorPhaseCN(i)}</span></div>`).join('')}</div><div style="margin-top:20px">${btn('取消生成','cancel-author','','danger small')}</div></div>`}
 if(tab==='overview')body=`<section class="focus-section"><h3>用一句话开始</h3>${area('author-idea','描述你想创建的故事',S.ui.authorIdea||'创建一个发生在雨夜公寓里的悬疑故事，玩家可以调查、关心 Alice，也可以选择离开。')}<div class="row">${btn('生成故事','generate-scenario','','primary')}<span class="muted">先生成可编辑草案，不会一次性预生成整棵分支。</span></div></section><section class="focus-section"><h3>基本信息</h3>${fieldControl('title','标题',false)}${fieldControl('description','简介')}<div class="two">${fieldControl('genre','类型',false)}${fieldControl('tone','整体语气',false)}</div>${fieldControl('playStyle','预期玩法',false)}${select('player-character','玩家扮演角色',sc.characters.map(c=>[c.id,c.identity]),sc.playerCharacter)}</section>`;
 if(tab==='world')body=`<section class="focus-section"><h3>世界设定</h3>${fieldControl('world.rules','世界规则')}${fieldControl('world.lore','背景设定')}${fieldControl('world.locations','地点（每行一条）')}${fieldControl('world.constraints','不能被突破的约束')}</section>`;
 if(tab==='characters'){let idx=sc.characters.findIndex(c=>c.id===S.ui.characterId);if(idx<0)idx=0;const c=sc.characters[idx];S.ui.characterId=c?.id;body=`<div class="character-switcher">${sc.characters.map(x=>btn(x.identity,'ia-character',x.id,x.id===c.id?'active small':'small')).join('')}${btn('＋ 添加角色','add-character','','small')}</div>${c?`<section class="focus-section"><div class="row"><h3 class="grow">${esc(c.identity)}</h3>${btn('删除角色','delete-character',String(idx),'small danger',c.id===sc.playerCharacter)}</div><div class="two">${fieldControl('characters.'+idx+'.identity','身份',false)}${fieldControl('characters.'+idx+'.personality','性格',false)}${fieldControl('characters.'+idx+'.desire','想得到什么')}${fieldControl('characters.'+idx+'.fear','害怕什么')}${fieldControl('characters.'+idx+'.secrets','隐藏的秘密')}${fieldControl('characters.'+idx+'.knowledge','目前知道什么')}</div>${fieldControl('characters.'+idx+'.relationship','与玩家的初始关系')}${fieldControl('characters.'+idx+'.visualState','外观与当前状态')}</section>`:empty('还没有角色。')}</section>`}
 if(tab==='drama')body=`<section class="focus-section"><h3>戏剧结构</h3><p class="muted">这些字段帮助系统理解故事为什么值得继续推进，但不会预先规定玩家必须走哪条路。</p>${[['coreQuestion','这个故事最终要回答什么？'],['centralConflict','哪些目标无法同时满足？'],['truthModel','哪些事实不能被后续反转推翻？'],['secrets','谁在隐瞒什么？'],['misbeliefs','角色可能误解了什么？'],['pressures','为什么事情不能一直拖下去？'],['anchors','有哪些值得出现、但不强制发生的故事锚点？'],['endingFamilies','这个篇章可能怎样自然结束？'],['foreshadows','一开始有哪些可以追溯的伏笔？'],['forbiddenOutcomes','哪些结果绝对不允许发生？']].map(([k,l])=>fieldControl('drama.'+k,l)).join('')}</section>`;

 if(tab==='publish'){const errs=scenarioErrors(sc);body=`<section class="focus-section"><h3>发布前检查</h3><label class="checkrow"><input id="reviewed" type="checkbox" ${sc.reviewed?'checked':''}>我已确认世界规则、稳定真相、角色知情范围和戏剧结构。</label>${errs.length?note('<b>还有 '+errs.length+' 项需要修正</b><div>'+errs.map(e=>esc(e)).join('<br>')+'</div>','warn'):note('检查通过，可以发布。')}<div class="row">${btn('重新检查','validate-scenario')}${btn('发布新版本','publish','','primary')}${btn('发布并试玩','publish-play','','primary')}${btn('导出故事包','export-scenario')}${btn('查看技术校验','ia-dev','qa','small')}</div></section><section class="focus-section"><h3>发布记录</h3>${sc.publishHistory.length?table(['版本','发布时间','说明'],sc.publishHistory.map(v=>`<tr><td>${esc(v.version)}</td><td>${date(v.at)}</td><td>已开始的游玩会继续使用这个版本 ${btn('查看快照','snapshot',v.version,'small')}</td></tr>`)):empty('还没有发布记录。')}<div class="row" style="margin-top:14px">${btn('主题与显示设置','ia-nav','settings','small')}${btn('查看字段变更','ia-creator','changes','small')}</div></section>`}

 if(tab==='theme')body=iaThemeSettings(sc);
 return `${head}${sc.publishHistory.length&&sc.status==='DRAFT'?note('你正在编辑新的草稿；已经开始的游玩不会被这次修改突然替换。'):''}${body}`;

function iaThemeSettings(sc){return `<section class="focus-section"><h3>受控主题配置 ${req('FR-032')}</h3>${note('只接受预定义 token，不执行自定义 CSS 或 JavaScript。游玩会话使用发布时的主题快照。')}<div class="two">${input('theme-accent','按钮颜色',sc.theme.accent,'color')}${select('theme-font','字体栈',[['system','系统无衬线'],['serif','系统衬线'],['mono','系统等宽']],sc.theme.font)}${select('theme-density','布局密度',[['comfortable','标准'],['compact','紧凑']],sc.theme.density)}${select('theme-subtitles','字幕样式',[['normal','标准'],['large','大字幕']],sc.theme.subtitles)}</div><div class="video" style="min-height:150px"><h3>主题预览</h3><div class="caption">Alice：你准备怎么做？</div></div></section>`}
function iaSettings(){const sc=editScenario();return `<div class="task-head"><div class="grow"><h1>设置</h1><p class="muted">显示偏好、本地存档与反馈入口。</p></div></div><div class="settings-grid"><div class="settings-panel"><h3>主题与显示</h3>${iaThemeSettings(sc)}</div><div class="settings-panel"><h3>本地数据</h3><p class="muted">当前进度只保存在这个浏览器中。</p><div class="row">${btn('保存进度','save','','small')}${btn('导出存档','export-save','','small')}${btn('导入存档','import-save','','small')}${btn('恢复测试','reload-test','','small')}</div><div class="divider"></div><div class="row">${btn('字段变更记录','ia-creator','changes','small')}${btn('体验反馈','nav','feedback','small')}${btn('原型说明','nav','notes','small')}</div><div class="divider"></div>${btn('重置全部本地数据','reset-all','','danger small')}</div></div>`}
function iaIntentReceipt(){const s=session(),a=s?.action,i=a?.intent;if(!a||!i||!['MEDIUM_ECHO','MEDIUM_EDIT','CLARIFICATION'].includes(a.status))return '';const editing=a.status==='MEDIUM_EDIT'||a.status==='CLARIFICATION';return `<div class="inline-intent"><div class="row"><b class="grow">我这样理解你的意思</b></div><div class="kv"><div>你要做的事</div><div>${esc(i.action)}</div><div>你想达到的目的</div><div>${esc(i.desire||'你没有明确说明')}</div><div>你希望采用的方式</div><div>${esc(i.strategy||'你没有特别说明')}</div></div>${a.status==='MEDIUM_ECHO'?`<p class="muted" style="margin-top:8px">如果理解不对，可以先改一下；不改也可以直接继续。</p><div class="row">${btn('修改理解','edit-intent','','small')}${btn('按这个意思继续','confirm-intent','','primary small')}</div>`:''}${a.status==='CLARIFICATION'?note('这个行动可能带来差别很大的后果，请先确认你的真实意图。','warn'):''}${editing?`<div class="divider"></div>${input('intent-action','你实际想做什么',i.action)}${input('intent-desire','你真正想达到什么目的（可留空）',i.desire||'')}${input('intent-strategy','你希望采用什么方式（可留空）',i.strategy||'')}<div class="row">${btn('确认并继续','apply-intent','','primary')}${btn('取消这次行动','cancel-action')}</div>`:''}</div>`}
function iaPlayerPopover(s){const p=S.ui.playerPopover;if(!p)return '';let title='',body='';if(p==='inventory'){title='背包';body=s.world.inventory.length?`<div class="pillrow">${s.world.inventory.map(x=>badge(userItemName(x))).join('')}</div>${s.world.inventory.includes('Apartment Key')?`<div style="margin-top:10px">${btn('使用钥匙检查档案柜','use-key','','small')}</div>`:''}`:empty('背包是空的。')}if(p==='trust'){title='关系';body=`<div class="kv"><div>Alice 的信任</div><div><b>${s.world.relationships.alice}</b> / 100</div><div>当前位置</div><div>${esc(userLocationName(s.world.location))}</div><div>体力</div><div>${s.world.health} / 100</div></div>`}if(p==='clues'){title='线索';body=Object.entries(s.world.clues).length?Object.entries(s.world.clues).map(([k,v])=>`<div class="notice"><b>${esc(userClueName(k))}</b> ${badge(v==='DISCOVERED'?'已发现':v==='VERIFIED'?'已验证':'未确认')} ${btn('验证','verify-clue',k,'small',v!=='DISCOVERED')}</div>`).join(''):empty('还没有发现线索。')}if(p==='wish'){title='许愿';body=(s.wishes.slice(-4).map(w=>`<div class="notice">${esc(w.raw)} ${badge(userWishStatus(w.status))}<br><small>${esc(w.effective_boundary.replace(/Beat/g,'剧情节点'))}</small></div>`).join('')||empty('当前没有愿望。'))+`<div style="margin-top:8px">${btn('管理愿望','wish-drawer','','primary small')}</div>`}return `<div class="composer-popover"><div class="composer-popover-head"><b>${title}</b><div class="right">${btn('关闭','ia-player-popover',p,'small')}</div></div>${body}</div>`}
function iaPlayer(){const s=session();if(!s)return `<div class="player-shell"><div class="player-scroll"><div class="player-content"><h1>当前游玩</h1>${empty('还没有开始游玩。请先从故事库选择一个已发布的世界。')}${btn('前往故事库','ia-nav','home','primary')}</div></div></div>`;const arc=currentArc(),p=s.player;if(arc.status==='CLOSED')return `<div class="player-shell"><div class="player-scroll"><div class="player-content">${renderEnding()}</div></div></div>`;const recs=visibleRecommendations(),busy=!!(s.action||s.selected),timed=s.timed,clueCount=Object.values(s.world.clues).filter(v=>v==='DISCOVERED'||v==='VERIFIED').length;const latest=s.messages.slice(0,3).map(m=>({...m,text:userMessage(m.text)}));const selectedBranch=s.selected?s.branches.find(b=>b.id===s.selected.branchId):null;const loadingStage=p.status==='LOADING'||(s.action?.status==='GENERATING'&&p.position>=p.duration);
 let composer='';if(timed?.active){const choices=(s.epoch?.readyIds||[]).map(id=>s.branches.find(b=>b.id===id)).filter(b=>b?.status==='READY');composer=`<div class="qte-composer"><div class="qte-row"><div class="countdown" id="qte-count" aria-live="polite">${Math.ceil(timed.remaining)}</div><div><b>${timed.kind==='qte'?'立即反应':'现在就要回应'}</b><div class="muted">倒计时结束后，会按这个故事已经设定好的结果继续。</div></div></div><div class="qte-choices">${choices.map(b=>btn(esc(b.label),'timed-choice',b.id,'primary')).join('')}</div></div>`}else{composer=`<div class="composer-box"><textarea id="free-input" placeholder="我有别的想法……" ${busy?'aria-disabled="true"':''}>${esc(S.ui.inputDraft)}</textarea><div class="composer-actions"><details><summary class="muted">试试这些输入</summary><div class="row" style="padding:6px">${[['后门观察','我假装已经离开，然后绕到后门观察 Alice。'],['保护她','我跟着她，但别让她发现。我是想保护她。'],['看抽屉','看一下抽屉。'],['找录音','寻找关键录音'],['等待','等一小时']].map(([l,t])=>btn(l,'fill-action',t,'small',busy)).join('')}</div></details><span class="muted">${busy?'当前行动正在处理中':'可以慢慢想，不会自动替你选择'}</span><div class="right">${btn('↑','submit-action','','composer-submit',busy||!!timed?.preparing)}</div></div></div>`}
 const videoHTML=loadingStage?`<div class="scene-loading"><div class="spinner"></div><h2>${s.selected?'下一幕已就绪，正在准备播放':'正在准备下一幕'}</h2><p>${s.action?'系统正在把你的行动变成新的剧情画面。':'马上接入你刚才选择的下一幕。'}</p></div>`:`<div class="video"><h2>${esc(p.sceneTitle)}</h2><p>${esc(p.sceneText)}</p><div class="caption">${esc(p.caption)}</div></div>`;
 const choiceHTML=timed?.active?'':s.selected&&selectedBranch?`<div class="player-recommendations"><button class="selected-choice" disabled>✓ ${esc(selectedBranch.label)}<small>你已选择这一项，其他选项已收起。</small></button></div>`:recs.length?`<div class="player-recommendations">${recs.map(b=>`<button data-action="select-branch" data-id="${b.id}" data-ready="true">${esc(b.label)}</button>`).join('')}</div>`:!busy?`<div class="player-recommendations"><div class="muted">${p.position<p.lead?'继续观看，临近分岔点时会出现可选行动。':'系统正在准备下一组可选行动；你也可以直接输入自己的想法。'} ${p.position>=p.lead?btn('重新准备建议','prepare-recs','','small'):''}</div></div>`:'';
