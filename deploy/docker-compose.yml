services:
  postgres:
    image: postgres:16
    container_name: interaction-drama-db
    environment:
      POSTGRES_USER: drama
      POSTGRES_PASSWORD: drama
      POSTGRES_DB: interaction_drama
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama -d interaction_drama"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
